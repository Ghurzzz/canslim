<script>
// ── Değerleme tooltip ────────────────────────────────────────────────────────
(function(){
  var tip = null;
  function getOrCreateTip(){
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'val-tooltip';
      tip.style.cssText = 'position:fixed;background:#1e293b;border:1px solid #374151;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:11px;line-height:1.7;max-width:280px;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none';
      document.body.appendChild(tip);
    }
    return tip;
  }
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest('.val-tip');
    if(!el) return;
    var parts = el.getAttribute('data-tip').split('||');
    var t = getOrCreateTip();
    t.innerHTML = '<strong style="color:#60a5fa">'+parts[0]+'</strong><br>'+parts[1]+'<br><br><span style="color:#f59e0b">'+parts[2]+'</span>';
    t.style.display = 'block';
    t.style.left = Math.min(e.clientX+14, window.innerWidth-300)+'px';
    t.style.top = Math.max(e.clientY-10, 10)+'px';
  });
  document.addEventListener('mousemove', function(e){
    if(!tip || tip.style.display==='none') return;
    if(!e.target.closest('.val-tip')){ tip.style.display='none'; return; }
    tip.style.left = Math.min(e.clientX+14, window.innerWidth-300)+'px';
    tip.style.top = Math.max(e.clientY-10, 10)+'px';
  });
  document.addEventListener('mouseout', function(e){
    if(!e.target.closest('.val-tip')) return;
    if(!e.relatedTarget || !e.relatedTarget.closest('.val-tip')){
      if(tip) tip.style.display='none';
    }
  });
})();
</script>

function ib(key,label){
  return label+' <span class="minfo" onclick="showInfo(\''+key+'\',event)">?</span>';
}

function setTab(t,el){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active");});
  el.classList.add("active");
  var tfRow=document.getElementById("tfRow");
  if(tfRow) tfRow.style.display=(t==="dashboard"||t==="earnings"||t==="rutin"||t==="haftalik"||t==="screener"||t==="valuation"||t==="direction")?"none":"flex";
  if(t==="dashboard") renderDashboard();
  else if(t==="port") renderPortfolio();
  else if(t==="earnings") renderEarnings();
  else if(t==="haftalik") renderHaftalik();
  else if(t==="screener") renderScreener();
  else if(t==="valuation") renderValuation();
  else if(t==="direction") renderDirection();
  else if(t==="minervini") renderMinervini();
  else {
    var g=document.getElementById('grid');
    if(g){g.style.display='';g.style.width='';}
    renderGrid();
  }
}

function setTf(tf,el){
  curTf=tf;
  document.querySelectorAll(".tf-btn").forEach(function(b){b.classList.toggle("active",b.dataset.tf===tf);});
  curData=(TF_DATA[tf]||TF_DATA["1d"]).slice();
  renderStats();
  renderGrid();
}

function filtered(){
  var d=curData.filter(function(r){return !r.hata;});
  if(curTab==="port") return d.filter(function(r){return PORT.includes(r.ticker);});
  if(curTab==="buy") return d.filter(function(r){return r.sinyal==="GUCLU AL"||r.sinyal==="AL";});
  if(curTab==="sell") return d.filter(function(r){return r.sinyal==="SAT";});
  return d;
}

function renderStats(){
  var d=curData.filter(function(r){return !r.hata;});
  var cnt={};
  d.forEach(function(r){cnt[r.sinyal]=(cnt[r.sinyal]||0)+1;});
  document.getElementById("stats").innerHTML=
    '<div class="pill g"><div class="dot"></div>Guclu Al: '+(cnt["GUCLU AL"]||0)+'</div>'+
    '<div class="pill g"><div class="dot"></div>Al: '+(cnt["AL"]||0)+'</div>'+

}


function loadPortCost(){
  try{ var d=localStorage.getItem('port_cost'); return d?JSON.parse(d):{} }catch(e){return {};}
}
function savePortCost(data){
  try{ localStorage.setItem('port_cost', JSON.stringify(data)); }catch(e){}
}
function updatePortCost(ticker, field, value){
  var d = loadPortCost();
  if(!d[ticker]) d[ticker] = {cost:0, lot:0};
  d[ticker][field] = parseFloat(value)||0;
  savePortCost(d);
  // PORT_COST'u da güncelle (anlık hesaplama için)
  if(typeof PORT_COST !== 'undefined'){
    if(!PORT_COST[ticker]) PORT_COST[ticker] = {cost:0, lot:0};
    PORT_COST[ticker][field] = parseFloat(value)||0;
  }
  renderPortfolio();
}

function getTodayKey(){
  return new Date().toDateString();
}

function loadChecked(){
  try{
    var data = localStorage.getItem('rutin_checked');
    if(!data) return {};
    var parsed = JSON.parse(data);
    // Sadece bugünün verilerini kullan
    if(parsed.date !== getTodayKey()) return {};
    return parsed.items || {};
  }catch(e){return {};}
}

function saveChecked(checked){
  localStorage.setItem('rutin_checked', JSON.stringify({
    date: getTodayKey(),
    items: checked
  }));
}

function toggleCheck(id){
  var checked = loadChecked();
  if(checked[id]) delete checked[id];
  else checked[id] = true;
  saveChecked(checked);
  renderRutin();
}

function resetRutin(){
  localStorage.removeItem('rutin_checked');
  renderRutin();
}

function buildRutinHTML(){
  var checked = loadChecked();
  var today = new Date();
  var isWeekend = today.getDay() === 0 || today.getDay() === 6;
  var dayName = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][today.getDay()];
  var dateStr = today.toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});

  // Progress hesapla
  var totalItems = 0;
  var doneItems = 0;
  var sections = isWeekend ? ['haftalik'] : ['sabah','oglen','aksam'];
  sections.forEach(function(k){
    RUTIN_ITEMS[k].items.forEach(function(item){
      totalItems++;
      if(checked[item.id]) doneItems++;
    });
  });
  var pct = totalItems > 0 ? Math.round(doneItems/totalItems*100) : 0;
  var pctCol = pct===100?'var(--green)':pct>=50?'var(--yellow)':'var(--muted)';

  var h = '<div style="grid-column:1/-1">';

  // Header
  h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">';
  h += '<div><div style="font-size:18px;font-weight:700;color:var(--text)">'+dayName+' Rutini</div>';
  h += '<div style="font-size:12px;color:var(--muted)">'+dateStr+'</div></div>';
  h += '<div style="text-align:right">';
  h += '<div style="font-size:28px;font-weight:700;color:'+pctCol+'">'+pct+'%</div>';
  h += '<div style="font-size:11px;color:var(--muted)">'+doneItems+'/'+totalItems+' tamamlandı</div></div></div>';
  h += '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:12px">';
  h += '<div style="height:100%;width:'+pct+'%;background:'+pctCol+';border-radius:3px;transition:width .5s ease"></div></div>';
  if(pct===100) h += '<div style="text-align:center;margin-top:10px;font-size:14px;color:var(--green)">🎉 Tüm maddeler tamamlandı!</div>';
  h += '</div>';

  // Sections
  sections.forEach(function(k){
    var sec = RUTIN_ITEMS[k];
    var secDone = sec.items.filter(function(i){return checked[i.id];}).length;
    var secTotal = sec.items.length;
    var secPct = Math.round(secDone/secTotal*100);
    var secCol = secPct===100?'var(--green)':secPct>0?'var(--yellow)':'var(--muted)';

    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    h += '<div style="font-size:13px;font-weight:600;color:var(--text)">'+sec.label+'</div>';
    h += '<span style="font-size:11px;color:'+secCol+';font-weight:600">'+secDone+'/'+secTotal+'</span></div>';

    sec.items.forEach(function(item){
      var done = !!checked[item.id];
      var bgColor = done ? 'rgba(16,185,129,.06)' : 'rgba(255,255,255,.02)';
      var borderColor = done ? 'rgba(16,185,129,.2)' : 'rgba(255,255,255,.05)';
      var checkBorder = done ? 'var(--green)' : 'var(--muted)';
      var checkBg = done ? 'var(--green)' : 'transparent';
      var textColor = done ? 'var(--muted)' : 'var(--text)';
      var textDeco = done ? 'line-through' : 'none';
      var checkmark = done ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' : '';
      h += '<div onclick="toggleCheck(\'' + item.id + '\')" style="display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;background:' + bgColor + ';border:1px solid ' + borderColor + '">';
      h += '<div style="flex-shrink:0;width:20px;height:20px;border-radius:5px;border:2px solid ' + checkBorder + ';background:' + checkBg + ';display:flex;align-items:center;justify-content:center;margin-top:1px">' + checkmark + '</div>';
      h += '<span style="font-size:13px;color:' + textColor + ';line-height:1.5;text-decoration:' + textDeco + '">' + item.text + '</span>';
      h += '</div>';
    });
    h += '</div>';
  });

  // Hafta içi olduğunda haftalık bölümü de göster (katlanabilir)

function addTicker(list){
  var inputId = list==='watch'?"newWatchTicker":"newPortTicker";
  var val = document.getElementById(inputId).value.trim().toUpperCase();
  if(!val) return;
  if(list==='watch' && !editWatchlist.includes(val)) editWatchlist.push(val);
  if(list==='port'  && !editPortfolio.includes(val)) editPortfolio.push(val);
  document.getElementById(inputId).value = "";
  renderEditLists();
}

function removeTicker(list, idx){
  if(list==='watch') editWatchlist.splice(idx,1);
  else editPortfolio.splice(idx,1);
  renderEditLists();
}

function saveListToGithub(){
  var token = document.getElementById("ghTokenInput").value.trim();
  if(!token){ setEditStatus("❌ Token gerekli — kutuya gir","red"); return; }
  localStorage.setItem('gh_token', token);

  var config = { watchlist: editWatchlist, portfolio: editPortfolio, portfolio_cost: editPortfolioCost };
  var content = JSON.stringify(config, null, 2);
  var b64 = btoa(unescape(encodeURIComponent(content)));

  setEditStatus("💾 Kaydediliyor...","yellow");

  var apiUrl = "https://api.github.com/repos/ghurzzz/canslim/contents/config.json";
  var headers = {"Authorization":"token "+token,"Content-Type":"application/json"};

  // First get current SHA if exists
  fetch(apiUrl, {headers:headers})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(existing){
      var payload = {
        message: "Liste guncellendi " + new Date().toLocaleDateString("tr-TR"),
        content: b64
      };
      if(existing && existing.sha) payload.sha = existing.sha;

      return fetch(apiUrl, {
        method:"PUT",
        headers:headers,
        body:JSON.stringify(payload)
      });
    })
    .then(function(r){
      if(r.ok || r.status===201){
        setEditStatus("✅ Kaydedildi! Bir sonraki Colab çalıştırmasında aktif olur.","green");
        setTimeout(function(){closeEditPopup();},2000);
      } else {
        setEditStatus("❌ Hata: "+r.status+" — Tokenı kontrol et","red");
      }
    })
    .catch(function(e){ setEditStatus("❌ Hata: "+e.message,"red"); });
}

function setEditStatus(msg, color){
  var el = document.getElementById("editStatus");
  if(el){
    el.textContent = msg;
    el.style.color = color==="green"?"var(--green)":color==="red"?"var(--red2)":"var(--yellow)";
  }
}

      h += '<span style="font-size:9px;color:var(--muted)">'+impLabel(c.imp).split(' ')[0]+'</span></div>';
      h += '<div style="font-size:10px;font-weight:600;color:'+(noData?'var(--muted)':cr.passed?'var(--text)':col)+'">'+cr.val+' <span style="font-size:9px;color:var(--muted);font-weight:400">'+(!noData?'limit: ':'')+c.limit+'</span></div>';
      h += '</div>';
    });
    h += '</div></div>';

    var wb = r.in_watchlist?'<span style="color:#60a5fa;font-size:9px;font-weight:700;margin-left:4px">W</span>':'';
    var chgCol = r.change>=0?'var(--green2)':'var(--red2)';
    var critFail = criteria.filter(function(c){return r.criteria&&r.criteria[c.id]&&!r.criteria[c.id].passed&&c.imp==='critical';});

      return '<span style="background:rgba(239,68,68,.1);color:var(--red2);padding:1px 5px;border-radius:3px;font-size:9px;margin-right:3px">❌'+c.label+'</span>';

      +'<div style="font-size:11px;color:'+chgCol+'">'+(r.change>=0?'+':'')+r.change+'%</div></div>'
      +'</div>'

      +'</div>';
  }

  function buildHTML(){
    var h = '<div style="grid-column:1/-1">';

    // Summary
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
    h += '<div style="font-size:16px;font-weight:700;margin-bottom:4px">🔍 CANSLIM Screener</div>';
    h += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">16 kriter · 3 önem seviyesi · '+data.length+' hisse tarandı</div>';
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">';
    h += '<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--green)">'+passed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçti</div></div>';
    h += '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--red2)">'+failed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçemedi</div></div>';
    h += '<div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:#60a5fa">'+data.filter(function(r){return r.in_watchlist||r.in_portfolio;}).length+'</div><div style="font-size:10px;color:var(--muted)">Listemde</div></div>';
    h += '</div>';
    // Legend
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10px">';
    h += '<span>🔴 <strong>Zorunlu</strong> (3x): EPS QoQ, SMA200, M Kriteri</span>';
    h += '<span>🟡 <strong>Önemli</strong> (2x): Gelir, ROE, Marjin, SMA50, 52H</span>';
    h += '<span>🔵 <strong>Destek</strong> (1x): Diğerleri</span>';
    h += '</div></div>';

    // Geçenler
    if(passed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(16,185,129,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--green);letter-spacing:2px;text-transform:uppercase">✅ CANSLIM Geçti ('+passed.length+')</div>';
      passed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    // Watchlist/Portfolio (geçemeyenler)
    var myFailed = failed.filter(function(r){return r.in_watchlist||r.in_portfolio;});
    if(myFailed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(59,130,246,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:#60a5fa;letter-spacing:2px;text-transform:uppercase">📋 Listemde (Geçemedi, '+myFailed.length+')</div>';
      myFailed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    h += '</div>';
    return h;
  }

  grid.innerHTML = buildHTML();

  // onclick handlers
  data.forEach(function(r){
    var el = document.getElementById('sc-'+r.ticker);
    if(el){
      el.onclick = function(e){
        e.stopPropagation();
        if(expandedTicker===r.ticker){ expandedTicker=null; }
        else { expandedTicker=r.ticker; }
        grid.innerHTML = buildHTML();
        // Re-attach handlers
        data.forEach(function(r2){
          var el2 = document.getElementById('sc-'+r2.ticker);
          if(el2) el2.onclick = arguments.callee.bind({ticker:r2.ticker});
        });
        attachHandlers();
      };
    }
  });

  function attachHandlers(){
    data.forEach(function(r){
      var el = document.getElementById('sc-'+r.ticker);
      if(!el) return;
      el.onclick = (function(ticker){
        return function(e){
          e.stopPropagation();
          expandedTicker = expandedTicker===ticker ? null : ticker;
          grid.innerHTML = buildHTML();
          attachHandlers();
        };
      })(r.ticker);
    });
  }
  attachHandlers();
}

    if(c6) score++;
    var c7 = r.pct_from_52w !== undefined && r.pct_from_52w <= 25;
    details.push({label:'52H Zirveye -%25', pass:c7, val: (r.pct_from_52w !== undefined ? '-%'+r.pct_from_52w+' uzak' : '?'), tip:'Hisse yillik zirvesinin %25\'i icinde olmali. Zirveye yakin = guclu hisse.'});
    if(c7) score++;
    var c8 = r.gain_6m !== undefined && r.gain_6m >= 20;
    details.push({label:'RS Guc >%20 (6A)', pass:c8, val: (r.gain_6m !== undefined ? '6A: %'+r.gain_6m : '?'), tip:'Son 6 ayda S&P500\'den daha iyi performans. RS>70 demek en guclu %30 icinde olmak.'});
    if(c8) score++;
    return {score: score, details: details};
  }

  function calcVCP(r){
    var atr = r.atr; var price = r.fiyat;
    if(!atr || !price) return {hasVCP: null, note: 'ATR verisi yok'};
    var atrPct = (atr / price * 100);
    var isLowVol = atrPct < 3.5;
    var nearHigh = r.pct_from_52w <= 20;
    var aboveMAs = r.above50 && r.above200;
    var hasVCP = isLowVol && nearHigh && aboveMAs;
    return {hasVCP: hasVCP, atrPct: atrPct.toFixed(1), note: hasVCP ? 'VCP formasyonu olasi' : 'VCP kosullari tam saglanmiyor'};
  }

  var h = '<div style="padding:16px;width:100%;box-sizing:border-box">';

  // Üst açıklama
  h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px">';
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
  h += '<div style="font-size:22px;font-weight:700">🎯 Minervini Metodolojisi</div>';
  h += '<div style="background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:3px 10px;font-size:10px;color:var(--yellow);font-weight:600">TRADE LIKE A STOCK MARKET WIZARD</div>';
  h += '</div>';
  h += '<div style="font-size:12px;color:#94a3b8;line-height:1.8;margin-bottom:14px">';
  h += '<strong style="color:var(--text)">Mark Minervini</strong>, ABD Hisse Senedi Sampiyonlugunu birden fazla kez kazanmis ve yillik ortalama <strong style="color:var(--green)">%220+ getiri</strong> uretmis bir trader\'dir. ';
  h += 'Metodolojisi iki unsura dayanir: <strong style="color:#60a5fa">Trend Template</strong> (dogru hisseyi bul) + <strong style="color:#a78bfa">VCP + SEPA Girisi</strong> (dogru anda gir). ';
  h += 'Asla dusen veya zayif hisse almaz — sadece guclu, baza girmis ve kirilim noktasina yakin liderlere girer.';
  h += '</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">';
  [{icon:'📐',title:'Trend Template',desc:'8 kriterin tamamini karsilayan hisseler satin almaya uygun bolgededir. 1 kriter bile eksikse hisse listeye girmez.'},
   {icon:'🌀',title:'VCP (Volatilite Daralması)',desc:'Fiyat konsolidasyona girer, her dalga hem fiyat hem hacim olarak daralir. Kurumsal satisın bittiginin isaretidir.'},
   {icon:'🎯',title:'SEPA Girisi',desc:'Pivot kiriliminda hacimle birlikte cok spesifik giris. Asla erken, asla gec.'},
   {icon:'🛡️',title:'Risk Yönetimi',desc:'Her islemde maks %1-2 sermaye riski. Stop-loss pivot altina konur. Pozisyon buyuklugu buna gore hesaplanir.'}
  ].forEach(function(c){
    h += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">';
    h += '<div style="font-size:14px;margin-bottom:4px">'+c.icon+' <strong style="color:var(--text)">'+c.title+'</strong></div>';
    h += '<div style="font-size:11px;color:#94a3b8;line-height:1.5">'+c.desc+'</div></div>';
  });
  h += '</div></div>';

  // Is akisi
  h += '<div style="background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
  h += '<div style="font-size:11px;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">📋 Dogru Sira — Is Akisi</div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">';
  ['1️⃣ CANSLIM Screener\'da temel kriterler','→','2️⃣ Trend Template (8/8 veya 7/8)','→','3️⃣ VCP Formasyonu (TradingView)','→','4️⃣ Pivot kirilimini bekle + hacim onayı','→','5️⃣ SEPA ile gir, stop pivot altına'].forEach(function(s){
    if(s==='→'){h+='<div style="color:var(--muted);font-size:16px">→</div>';}
    else{h+='<div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--text)">'+s+'</div>';}
  });
  h += '</div></div>';

  // Özet istatistikler
  var rows = data1d.filter(function(r){return !r.hata;});
  var scored = rows.map(function(r){ var tt=calcTrendTemplate(r); var vcp=calcVCP(r); return {r:r,tt:tt,vcp:vcp}; }).sort(function(a,b){return b.tt.score-a.tt.score;});
  var pass8=scored.filter(function(x){return x.tt.score>=8;}).length;
  var pass7=scored.filter(function(x){return x.tt.score>=7;}).length;
  var pass6=scored.filter(function(x){return x.tt.score>=6;}).length;
  var vcpC=scored.filter(function(x){return x.vcp.hasVCP;}).length;

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px">';
  [{v:pass8,l:'8/8 Tam Puan',c:'var(--green)',bg:'rgba(16,185,129,.08)',bd:'rgba(16,185,129,.25)'},
   {v:pass7,l:'7/8 Güçlü',c:'var(--green2)',bg:'rgba(52,211,153,.06)',bd:'rgba(52,211,153,.2)'},
   {v:pass6,l:'6/8 İzle',c:'var(--yellow)',bg:'rgba(245,158,11,.08)',bd:'rgba(245,158,11,.25)'},
   {v:vcpC,l:'VCP Adayı',c:'#a78bfa',bg:'rgba(167,139,250,.08)',bd:'rgba(167,139,250,.25)'}
  ].forEach(function(x){
    h+='<div style="background:'+x.bg+';border:1px solid '+x.bd+';border-radius:10px;padding:14px;text-align:center">';
    h+='<div style="font-size:26px;font-weight:700;color:'+x.c+'">'+x.v+'</div>';
    h+='<div style="font-size:10px;color:var(--muted)">'+x.l+'</div></div>';
  });
  h += '</div>';

  // Trend Template tablosu
  if(scored.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px">';
    h += '<div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase">📐 Trend Template Analizi</div>';
    h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;min-width:600px"><thead><tr style="background:var(--bg3)">';
    ['Hisse','Fiyat','TT Skoru','SMA50','SMA200','Altin Carpaz','52H Dip','52H Zirve','RS Guc','VCP?'].forEach(function(c,i){
      h+='<th style="text-align:'+(i===0?'left':'right')+';padding:8px '+(i===0?'14':'8')+'px;color:var(--muted);font-weight:600;white-space:nowrap">'+c+'</th>';
    });
    h += '</tr></thead><tbody>';
    scored.forEach(function(item,idx){
      var r=item.r; var tt=item.tt; var vcp=item.vcp; var score=tt.score;
      var scoreCol=score>=8?'var(--green)':score>=7?'var(--green2)':score>=6?'var(--yellow)':'var(--muted)';
      var scoreBg=score>=8?'rgba(16,185,129,.15)':score>=7?'rgba(52,211,153,.1)':score>=6?'rgba(245,158,11,.1)':'var(--bg3)';
      var bg=idx%2===0?'var(--bg)':'rgba(255,255,255,.015)';
      var inPort=PORT.includes(r.ticker);
      h+='<tr style="background:'+bg+';border-bottom:1px solid rgba(255,255,255,.03)">';
      h+='<td style="padding:10px 14px;font-weight:700"><span style="color:'+(score>=7?'var(--green)':score>=6?'var(--yellow)':'var(--text)')+'">'+r.ticker+'</span>';
      if(inPort) h+='<span style="color:var(--green);font-size:9px;font-weight:700;margin-left:4px">P</span>';
      h+='</td>';
      var dc=r.degisim>=0?'var(--green2)':'var(--red2)';
      h+='<td style="text-align:right;padding:8px"><div style="font-weight:600">$'+r.fiyat+'</div><div style="font-size:9px;color:'+dc+'">'+(r.degisim>=0?'+':'')+r.degisim+'%</div></td>';
      h+='<td style="text-align:right;padding:8px"><span style="background:'+scoreBg+';color:'+scoreCol+';border-radius:4px;padding:3px 8px;font-weight:700;font-size:12px">'+score+'/8</span></td>';
      h+='<td style="text-align:right;padding:8px;color:'+(r.above50?'var(--green)':'var(--red2)')+'">'+( r.above50?'✓ Ust.':'✗ Alt.')+'</td>';
      h+='<td style="text-align:right;padding:8px;color:'+(r.above200?'var(--green)':'var(--red2)')+'">'+( r.above200?'✓ Ust.':'✗ Alt.')+'</td>';
      var gc=r.sma50&&r.sma200&&r.sma50>r.sma200;
      h+='<td style="text-align:right;padding:8px;color:'+(gc?'var(--green)':'var(--red2)')+'">'+( gc?'✓':'✗')+'</td>';
      var lp=r.low52w?Math.round((r.fiyat-r.low52w)/r.low52w*100):null;
      h+='<td style="text-align:right;padding:8px;color:'+(lp!==null&&lp>=30?'var(--green)':lp!==null&&lp>=15?'var(--yellow)':'var(--red2)')+'">'+( lp!==null?'+%'+lp:'?')+'</td>';
      var c7=r.pct_from_52w!==undefined&&r.pct_from_52w<=25;
      h+='<td style="text-align:right;padding:8px;color:'+(c7?'var(--green)':r.pct_from_52w<=35?'var(--yellow)':'var(--red2)')+'">'+( r.pct_from_52w!==undefined?'-%'+r.pct_from_52w:'?')+'</td>';
      var c8=r.gain_6m!==undefined&&r.gain_6m>=20;
      h+='<td style="text-align:right;padding:8px;color:'+(c8?'var(--green)':r.gain_6m>=5?'var(--yellow)':'var(--red2)')+'">'+( r.gain_6m!==undefined?'%'+r.gain_6m:'?')+'</td>';
      h+='<td style="text-align:right;padding:8px">'+(vcp.hasVCP===null?'<span style="color:var(--muted)">—</span>':vcp.hasVCP?'<span style="color:#a78bfa;font-weight:600">✓ Olasi</span>':'<span style="color:var(--muted)">—</span>')+'</td>';
      h+='</tr>';
    });
    h += '</tbody></table></div></div>';
  }

  // Risk yönetimi
  h += '<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:16px 20px">';
  h += '<div style="font-size:11px;color:var(--red2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">🛡️ Minervini Risk Yönetimi Kuralları</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">';
  [{t:'%1-2 Sermaye Riski',d:'Her islemde toplam sermayenin maksimum %1-2\'si riske edilir.'},
   {t:'Stop-Loss Disiplini',d:'Stop seviyesi baz formasyonunun dibinin altina konur. Her defasinda uyulur.'},
   {t:'Pozisyon Buyuklugu',d:'= (Sermaye x %Risk) / (Giris - Stop). Matematikle hesaplanir.'},
   {t:'Earnings Kurali',d:'Rapor tarihinden 1-2 hafta once yeni pozisyon asilmaz.'},
   {t:'Piramitleme',d:'Ilk pozisyon kucuk. Fiyat dogru yonde giderse ek alim yapilir.'},
   {t:'Piyasa Yonu',d:'Duzeltme doneminde yeni pozisyon asilmaz. Sadece Follow-Through Day sonrasi.'}
  ].forEach(function(x){
    h+='<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px">';
    h+='<div style="font-size:11px;font-weight:600;color:var(--text);margin-bottom:4px">'+x.t+'</div>';
    h+='<div style="font-size:11px;color:#94a3b8;line-height:1.5">'+x.d+'</div></div>';
  });
  h += '</div></div></div>';
  grid.innerHTML = h;
}

function renderValuation(){
  var container = document.getElementById('grid');
  if(!container) return;
  container.style.display = 'block';
  container.style.width = '100%';

  var metrics = [
    {key:'eps_growth',   label:'EPS%',       desc:'Son ceyrek EPS buyume orani. CANSLIM C kriteri - en kritik metrik.',          ideal:'20+ iyi, 30+ guclu', lo:20, hi:100, fmt:'%', hb:true},
    {key:'rev_growth',   label:'Gelir%',      desc:'Son ceyrek gelir buyume. CANSLIM A kriteri. Pazar payi ve momentum gucunu gosterir.', ideal:'15+ iyi, 25+ guclu', lo:15, hi:100, fmt:'%', hb:true},
    {key:'pe_fwd',       label:'Ileri F/K',   desc:'Onumüzdeki 12 ay tahmini kazancina gore Fiyat/Kazanc orani.',                  ideal:'25 altı iyi, 35 altı kabul', lo:0, hi:25, fmt:'x', hb:false},
    {key:'peg',          label:'PEG',         desc:'F/K oranini buyume hizi ile karsilastirir. En dengeli degerleme metrigi.',     ideal:'1 altı ucuz, 1-2 makul, 2 ustu pahali', lo:0, hi:2, fmt:'x', hb:false},
    {key:'gross_margin', label:'Brut%',       desc:'Brut kar marjini. Sirketin fiyatlama gucunu gosterir.',                        ideal:'Yazilim 70+, Genel 40+', lo:40, hi:100, fmt:'%', hb:true},
    {key:'net_margin',   label:'Net%',        desc:'Net kar marjini. Tum giderler dusuldukten sonra kalan kar yuzdesi.',           ideal:'10+ iyi, 20+ mukemmel', lo:10, hi:100, fmt:'%', hb:true},
    {key:'roe',          label:'OKG',         desc:'Ozsermaye Karliligi (ROE). Yonetimin sermayeyi ne kadar verimli kullandigi.',  ideal:'15+ iyi, 25+ mukemmel', lo:15, hi:100, fmt:'%', hb:true},
    {key:'pe_ttm',       label:'F/K',         desc:'Son 12 ay gercek kazancina gore Fiyat/Kazanc. Tarihi karsilastirma icin.',    ideal:'Teknoloji 35 altı, Genel 25 altı', lo:0, hi:35, fmt:'x', hb:false},
    {key:'ps',           label:'F/S',         desc:'Fiyat/Satislar. Henuz karsiz veya hizli buyuyen sirketler icin kullanilir.',  ideal:'Teknoloji 8 altı, Genel 3 altı', lo:0, hi:8, fmt:'x', hb:false},
    {key:'pb',           label:'F/DD',        desc:'Fiyat/Defter Degeri. Sirketin net varliklarına gore fiyati.',                  ideal:'3 altı ucuz, 3-7 makul, 7 ustu pahali', lo:0, hi:5, fmt:'x', hb:false},
    {key:'analyst_target', label:'Hedef',     desc:'Analist konsensus hedef fiyati. Yukarı yonlu potansiyel gosterir.',            ideal:'Mevcut fiyattan yuksek olsun', lo:0, hi:0, fmt:'$', hb:true},
  ];

  function colOf(val,lo,hi,hb){
    if(val===null||val===undefined) return 'var(--muted)';
    var n=parseFloat(val); if(isNaN(n)) return 'var(--muted)';
    if(hb){ return n>=hi*0.7?'var(--green)':n>=lo?'var(--yellow)':'var(--red2)'; }
    else  { return n<=lo*1.2?'var(--green)':n<=hi?'var(--yellow)':'var(--red2)'; }
  }
  function fmtV(val,fmt,price){
    if(val===null||val===undefined) return '<span style="color:var(--muted)">-</span>';
    var n=parseFloat(val); if(isNaN(n)) return '<span style="color:var(--muted)">-</span>';
    if(fmt==='x') return n.toFixed(1)+'x';
    if(fmt==='%') return n.toFixed(1)+'%';
    if(fmt==='$'){
      var up=price>0?((n-price)/price*100).toFixed(1):null;
      var c=(up!==null&&parseFloat(up)>0)?'var(--green)':'var(--red2)';
      return '$'+n.toFixed(0)+(up!==null?' <span style="font-size:9px;color:'+c+'">'+(parseFloat(up)>0?'+':'')+up+'%</span>':'');
    }
    return String(n);
  }

  var data = (TF_DATA && TF_DATA['1d']) ? TF_DATA['1d'] : [];
  var rows = data.filter(function(r){ return !r.hata; });

  var h = '';
  h += '<div style="padding:16px;width:100%;box-sizing:border-box">';
  h += '<h2 style="font-size:16px;font-weight:700;margin-bottom:8px">&#x1F48E; De&#287;erleme Analizi</h2>';

  // Özet kutusu
  h += '<div style="background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:14px 16px;margin-bottom:16px">';
  h += '<div style="font-size:12px;font-weight:600;color:#60a5fa;margin-bottom:10px">Bu sayfayi nasil okumaliyim?</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;font-size:11px;color:#94a3b8;line-height:1.7">';
  h += '<div><strong style="color:var(--text)">1. Renklere bak:</strong> Yesil=iyi, Sari=dikkat, Kirmizi=zayif. Satir cogunlukla yesil = guclu hisse.</div>';
  h += '<div><strong style="color:var(--text)">2. EPS ve Gelir oncelikli:</strong> CANSLIM metodolojisinde en kritik iki metrik. Bu ikisi kirmiziysa diger metrikler ikinci plana dusuyor.</div>';
  h += '<div><strong style="color:var(--text)">3. PEG en dengeli:</strong> 1 alti ucuz, 1-2 makul, 2 ustu pahali. Hem buyumeyi hem fiyati birlikte degerlendirir.</div>';
  h += '<div><strong style="color:var(--text)">4. Analist Hedefi:</strong> Mevcut fiyattan yuksekse yesil. Kurumların beklentisini gosterir, tek basina alim sinyali degildir.</div>';
  h += '<div><strong style="color:var(--text)">5. Sutun basligina gel:</strong> Her metrik sutununun basligindaki mavi ikon uzerine fare ile gelince aciklama cikar.</div>';
  h += '</div></div>';

  // Tablo
  h += '<div style="width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:700px">';
  h += '<thead><tr style="background:var(--bg2)">';
  h += '<th style="text-align:left;padding:10px;color:var(--muted);font-weight:600">Hisse</th>';
  h += '<th style="text-align:right;padding:10px 8px;color:var(--muted);font-weight:600">Fiyat</th>';

  metrics.forEach(function(mm){
    var tipData = mm.label + '||' + mm.desc + '||' + mm.ideal;
    h += '<th style="text-align:right;padding:8px 4px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:10px">';
    h += mm.label;
    h += '<span class="val-tip" data-tip="' + tipData + '" style="cursor:help;width:14px;height:14px;border-radius:50%;background:rgba(96,165,250,.2);color:#60a5fa;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:3px;vertical-align:middle">?</span>';
    h += '</th>';
  });
  h += '</tr></thead><tbody>';

  rows.forEach(function(r,i){
    var bg=i%2===0?'var(--bg)':'rgba(255,255,255,.02)';
    var inP=r.portfolio;
    h += '<tr style="background:'+bg+';border-bottom:1px solid rgba(255,255,255,.03)">';
    h += '<td style="padding:10px;font-weight:700;color:'+(inP?'var(--green)':'var(--text)')+'">'+r.ticker;
    if(inP) h += '<span style="font-size:8px;background:rgba(16,185,129,.15);color:var(--green);padding:1px 4px;border-radius:3px;margin-left:4px">P</span>';
    h += '</td>';
    h += '<td style="text-align:right;padding:8px 4px;font-weight:600;font-size:10px">$'+r.fiyat+'</td>';
    metrics.forEach(function(mm){
      var val = mm.key==='analyst_target' ? r.fair_price_analyst : r[mm.key];
      var col = mm.key==='analyst_target'
        ? (r.fair_price_analyst&&r.fair_price_analyst>r.fiyat?'var(--green)':'var(--red2)')
        : colOf(val,mm.lo,mm.hi,mm.hb);
      h += '<td style="text-align:right;padding:10px 8px;color:'+col+'">'+fmtV(val,mm.fmt,r.fiyat)+'</td>';
    });
    h += '</tr>';
  });

  h += '</tbody></table>';
  h += '<div style="display:flex;gap:16px;margin-top:10px;font-size:10px;color:var(--muted)">';
  h += '<span><span style="color:var(--green)">&#9679;</span> Iyi</span>';
  h += '<span><span style="color:var(--yellow)">&#9679;</span> Makul</span>';
  h += '<span><span style="color:var(--red2)">&#9679;</span> Dikkat</span>';
  h += '<span>- = Veri yok</span>';
  h += '<span style="margin-left:auto"><span style="background:rgba(16,185,129,.15);color:var(--green);padding:1px 4px;border-radius:3px">P</span> Portfoy</span>';
  h += '</div></div></div>';

  container.innerHTML = h;
}
</script>
