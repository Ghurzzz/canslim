<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CANSLIM Scanner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cpolyline points='4,24 10,16 16,20 22,10 28,14' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#05070f;--bg2:#0d1117;--bg3:#161b24;--border:rgba(255,255,255,0.08);--text:#e2e8f0;--muted:#4b5563;--green:#10b981;--green2:#34d399;--red:#ef4444;--red2:#f87171;--yellow:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#111827);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1400px;margin:0 auto}
.logo-main{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.timestamp{font-size:11px;color:var(--muted);font-family:JetBrains Mono,monospace}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;margin-right:5px}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.nav{display:flex;gap:4px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;border:1px solid transparent;background:none;color:var(--muted);transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{background:var(--bg3);color:var(--text);border-color:var(--border)}
.tab.port.active{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.3)}
.tf-row{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);align-items:center;flex-wrap:wrap}
.tf-btn{padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-family:JetBrains Mono,monospace;transition:all .2s}
.tf-btn.active{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.4)}
.tf-btn.star{position:relative}
.tf-btn.star::after{content:'★';position:absolute;top:-5px;right:-4px;font-size:8px;color:var(--yellow)}
.tf-hint{font-size:10px;color:var(--muted)}
.stats{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.pill.g{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.25)}
.pill.r{background:rgba(239,68,68,.1);color:var(--red2);border-color:rgba(239,68,68,.25)}
.pill.y{background:rgba(245,158,11,.1);color:var(--yellow);border-color:rgba(245,158,11,.25)}
.pill.b{background:rgba(59,130,246,.1);color:#60a5fa;border-color:rgba(59,130,246,.25)}
.pill.m{background:var(--bg3);color:var(--muted);border-color:var(--border)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.main{padding:14px 20px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.accent{height:3px}
.cbody{padding:12px 14px}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.ticker{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;line-height:1}
.cpr{text-align:right}
.pval{font-family:JetBrains Mono,monospace;font-size:15px;font-weight:600}
.pchg{font-size:11px;font-family:JetBrains Mono,monospace;margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.port-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);margin-left:5px}
.sigs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.sp{font-size:9px;padding:2px 6px;border-radius:3px;font-family:JetBrains Mono,monospace}
.sg{background:rgba(16,185,129,.1);color:var(--green2);border:1px solid rgba(16,185,129,.2)}
.sb{background:rgba(239,68,68,.1);color:var(--red2);border:1px solid rgba(239,68,68,.2)}
.sn{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.chart-w{height:75px;margin-top:8px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.lv{background:var(--bg3);border-radius:5px;padding:6px;text-align:center;border:1px solid var(--border)}
.ll{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.lval{font-family:JetBrains Mono,monospace;font-size:11px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.mhead{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px}
.mclose{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.mbody{padding:14px 18px 18px}
.mchartw{height:150px;margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.dc{background:var(--bg3);border-radius:7px;padding:9px 11px;border:1px solid var(--border)}
.dl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.dv{font-family:JetBrains Mono,monospace;font-size:13px;font-weight:600}
.dbox{border-radius:9px;padding:13px;margin-bottom:12px;border:1px solid}
.dlbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.dverd{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:8px}
.drow{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.dkey{color:var(--muted)}
.rrbar{height:4px;background:var(--bg);border-radius:2px;margin-top:7px;overflow:hidden}
.rrfill{height:100%;border-radius:2px;transition:width .8s ease}
.vpbox{background:var(--bg3);border-radius:7px;padding:10px;border:1px solid var(--border);margin-bottom:12px}
.vptitle{font-size:9px;color:#60a5fa;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.vpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.vpc{background:var(--bg2);border-radius:5px;padding:7px;text-align:center;border:1px solid}
.minfo{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:rgba(96,165,250,.2);color:#60a5fa;font-size:9px;font-weight:700;cursor:pointer;margin-left:4px;border:1px solid rgba(96,165,250,.3)}
.minfo-popup{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.minfo-popup.open{display:flex}
.minfo-modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;position:relative}
.minfo-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.minfo-source{font-size:10px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.minfo-rel{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600}
.minfo-rel.high{background:rgba(16,185,129,.15);color:#10b981}
.minfo-rel.medium{background:rgba(245,158,11,.15);color:#f59e0b}
.minfo-rel.low{background:rgba(239,68,68,.15);color:#ef4444}
.minfo-desc{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:14px}
.minfo-warning{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:6px;padding:8px 10px;font-size:11px;color:#f59e0b;margin-bottom:14px}
.minfo-ranges{margin-bottom:14px}
.minfo-range-title{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.minfo-range{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.02)}
.minfo-range-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.minfo-canslim{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:6px;padding:8px 10px;font-size:11px;color:#60a5fa}
.minfo-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <span class="logo-main">CANSLIM SCANNER</span>
    <span class="timestamp"><span class="live-dot"></span>15.05.2026 19:14</span>
    <button onclick="openEditList()" style="background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa;padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit">✏️ Listeyi Düzenle</button>
  </div>
</div>
<div class="nav">
  <button class="tab active" onclick="setTab('dashboard',this)">🏠 Dashboard</button>
  <button class="tab" onclick="setTab('all',this)">📊 Hisseler</button>
  <button class="tab port" onclick="setTab('port',this)">💼 Portföyüm</button>
  <button class="tab" onclick="setTab('buy',this)">📈 Al</button>
  <button class="tab" onclick="setTab('sell',this)">📉 Sat</button>
  <button class="tab" onclick="setTab('earnings',this)">📅 Earnings</button>
  <button class="tab" onclick="setTab('rutin',this)">✅ Rutin</button>
  <button class="tab" onclick="setTab('haftalik',this)">📈 Haftalık</button>
  <button class="tab" onclick="setTab('screener',this)">🔍 Screener</button>
</div>
<div class="tf-row" id="tfRow" style="display:none">
  <button class="tf-btn active" data-tf="1d" onclick="setTf('1d',this)">1G</button>
  <button class="tf-btn star" data-tf="1wk" onclick="setTf('1wk',this)">1H</button>
  <button class="tf-btn" data-tf="1mo" onclick="setTf('1mo',this)">1A</button>
  <span class="tf-hint">CANSLIM önerilen: 1G + 1H</span>
</div>
<div class="stats" id="stats"></div>
<div class="main"><div class="grid" id="grid"></div></div>
<div class="overlay" id="overlay" onclick="closeM(event)">
  <div class="modal" id="modal"></div>
</div>

<div class="minfo-popup" id="editPopup" onclick="closeEditPopup(event)">
  <div class="minfo-modal" style="position:relative;max-width:560px" id="editModal">
    <button class="minfo-close" onclick="closeEditPopup()">✕</button>
    <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px">✏️ Listeyi Düzenle</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:16px">GitHub API key gerekli — değişiklikler anında kaydedilir</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div>
        <div style="font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">📋 Watchlist</div>
        <div id="watchlistEditor"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <input id="newWatchTicker" placeholder="Hisse ekle (TSLA)" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;font-family:inherit;text-transform:uppercase"/>
          <button onclick="addTicker('watch')" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer">+ Ekle</button>
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">💼 Portföy</div>
        <div id="portfolioEditor"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <input id="newPortTicker" placeholder="Hisse ekle (AAPL)" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;font-family:inherit;text-transform:uppercase"/>
          <button onclick="addTicker('port')" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer">+ Ekle</button>
        </div>
      </div>
    </div>
    <div style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:var(--green)">✅ Değişiklikler kaydedilince bir sonraki Colab çalıştırmasında aktif olur.</div>
<div style="margin-bottom:12px">
      <div style="font-size:10px;color:var(--muted);margin-bottom:5px">GitHub Token (bir kez gir, tarayici hatirlayacak)</div>
      <input id="ghTokenInput" placeholder="ghp_..." style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:11px;font-family:JetBrains Mono,monospace"/>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="saveListToGithub()" style="flex:1;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green);padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">💾 GitHuba Kaydet</button>
      <button onclick="closeEditPopup()" style="background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer">İptal</button>
    </div>
    <div id="editStatus" style="margin-top:10px;font-size:12px;text-align:center"></div>
  </div>
</div>

<div class="minfo-popup" id="minfoPopup" onclick="closeInfoPopup(event)">
  <div class="minfo-modal" id="minfoModal">
    <button class="minfo-close" onclick="closeInfoPopup()">✕</button>
    <div id="minfoContent"></div>
  </div>
</div>
<script>
var METRICS = {
  // TEKNİK
  'RSI': {
    title: 'RSI (Göreceli Güç Endeksi)',
    desc: 'Hissenin aşırı alım veya aşırı satım bölgesinde olup olmadığını gösterir. 14 günlük fiyat hareketlerini analiz eder.',
    source: 'Teknik Analiz',
    reliability: 'high',
    ranges: [
      {label:'Aşırı Satım',min:0,max:30,color:'green',desc:'Fırsat bölgesi — fiyat çok düşmüş'},
      {label:'Normal',min:30,max:70,color:'yellow',desc:'Nötr bölge'},
      {label:'Aşırı Alım',min:70,max:100,color:'red',desc:'Dikkat — fiyat çok yükselmiş'}
    ],
    canslim: 'N kriteri ile ilgili — fiyat momentumu'
  },
  'SMA50': {
    title: 'SMA 50 (50 Günlük Hareketli Ortalama)',
    desc: 'Son 50 günün ortalama kapanış fiyatı. Kısa-orta vadeli trend göstergesi.',
    source: 'Teknik Analiz',
    reliability: 'high',
    ranges: [
      {label:'Üzerinde',color:'green',desc:'Kısa vadeli trend pozitif — güçlü sinyal'},
      {label:'Altında',color:'red',desc:'Kısa vadeli trend negatif'}
    ],
    canslim: 'M kriteri — piyasa trendi'
  },
  'SMA200': {
    title: 'SMA 200 (200 Günlük Hareketli Ortalama)',
    desc: 'Son 200 günün ortalama kapanış fiyatı. Uzun vadeli trend göstergesi. En önemli teknik seviye.',
    source: 'Teknik Analiz',
    reliability: 'high',
    ranges: [
      {label:'Üzerinde',color:'green',desc:'Uzun vadeli boğa trendinde — CANSLIM için şart'},
      {label:'Altında',color:'red',desc:'Uzun vadeli ayı trendinde — CANSLIM için girme'}
    ],
    canslim: 'M kriteri — zorunlu koşul'
  },
  '52W': {
    title: '52 Haftalık Pozisyon',
    desc: 'Hissenin son 1 yıldaki fiyat aralığında nerede olduğunu gösterir. 0=yılın dibi, 100=yılın zirvesi.',
    source: 'Teknik Analiz',
    reliability: 'high',
    ranges: [
      {label:'0-30%',color:'green',desc:'Yılın dibine yakın — potansiyel fırsat'},
      {label:'30-70%',color:'yellow',desc:'Orta bölge — nötr'},
      {label:'70-85%',color:'yellow',desc:'Zirveye yaklaşıyor — izle'},
      {label:'85-100%',color:'red',desc:'Zirveye çok yakın — dikkatli gir'}
    ],
    canslim: 'N kriteri — yeni zirve kırılımı için ideal bölge %85-100'
  },
  'Hacim': {
    title: 'Hacim (İşlem Miktarı)',

    source: 'Teknik Analiz',
    reliability: 'high',
    ranges: [
      {label:'Yüksek (>1.3x)',color:'green',desc:'Kurumsal ilgi var — güçlü sinyal'},
      {label:'Normal (0.7-1.3x)',color:'yellow',desc:'Ortalama ilgi'},
      {label:'Düşük (<0.7x)',color:'red',desc:'İlgi azalmış — dikkat'}
    ],
    canslim: 'S kriteri — arz/talep dengesi'
  },
  // TEMEL
  'ForwardPE': {
    title: 'Forward P/E (İleriye Dönük Fiyat/Kazanç)',
    desc: 'Sirketin onumüzdeki 12 aydaki tahmini kazancina gore fiyati. Trailing P/E aracina gore gelecege odaklidigi icin daha onemlidir.',
    source: 'Temel Analiz — Analist tahmini',
    reliability: 'medium',
    warning: 'Analist tahminlerine dayanır, yanıltıcı olabilir',
    ranges: [
      {label:'<15',color:'green',desc:'Ucuz — büyüme beklentisi düşük veya hisse değer altında'},
      {label:'15-25',color:'green',desc:'Makul — çoğu sektör için normal'},
      {label:'25-40',color:'yellow',desc:'Pahalı ama büyüme primi ödeniyor'},
      {label:'>40',color:'red',desc:'Çok pahalı — yüksek büyüme beklentisi fiyatlanmış'}
    ],
    canslim: 'C ve A kriterleri ile ilgili'
  },
  'PEG': {
    title: 'PEG Oranı (Fiyat/Kazanç/Büyüme)',
    desc: 'P/E oranını büyüme hızıyla karşılaştırır. Büyüyen şirketler icin P/E\'den daha doğru değerleme ölçütü. PEG=1 adil değer kabul edilir.',
    source: 'Temel Analiz — Analist tahmini',
    reliability: 'medium',
    warning: 'Analist büyüme tahminlerine dayanır',
    ranges: [
      {label:'<1.0',color:'green',desc:'Ucuz — büyümesine göre değer altında'},
      {label:'1.0-1.5',color:'green',desc:'Makul — adil fiyat civarı'},
      {label:'1.5-2.0',color:'yellow',desc:'Biraz pahalı'},
      {label:'>2.0',color:'red',desc:'Pahalı — dikkatli ol'}
    ],
    canslim: 'A kriteri — büyüme kalitesi'
  },

function setTab(t,el){

  if(tfRow) tfRow.style.display=(t==="dashboard"||t==="earnings"||t==="rutin"||t==="haftalik"||t==="screener")?"none":"flex";

function filtered(){

function renderStats(){

function getTodayKey(){
  return new Date().toDateString();
}

function loadChecked(){
  try{
    var data = localStorage.getItem('rutin_checked');
    if(!data) return {};
    var parsed = JSON.parse(data);
    // Sadece bugünün verilerini kullan
    if(parsed.date !== getTodayKey()) return {};
    return parsed.items || {};
  }catch(e){return {};}
}

function saveChecked(checked){
  localStorage.setItem('rutin_checked', JSON.stringify({
    date: getTodayKey(),
    items: checked
  }));
}

function toggleCheck(id){
  var checked = loadChecked();
  if(checked[id]) delete checked[id];
  else checked[id] = true;
  saveChecked(checked);
  renderRutin();
}

function resetRutin(){
  localStorage.removeItem('rutin_checked');
  renderRutin();
}

function renderRutin(){
  var grid = document.getElementById('grid');
  var checked = loadChecked();
  var today = new Date();
  var isWeekend = today.getDay() === 0 || today.getDay() === 6;
  var dayName = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][today.getDay()];
  var dateStr = today.toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});

  // Progress hesapla
  var totalItems = 0;
  var doneItems = 0;
  var sections = isWeekend ? ['haftalik'] : ['sabah','oglen','aksam'];
  sections.forEach(function(k){
    RUTIN_ITEMS[k].items.forEach(function(item){
      totalItems++;
      if(checked[item.id]) doneItems++;
    });
  });
  var pct = totalItems > 0 ? Math.round(doneItems/totalItems*100) : 0;
  var pctCol = pct===100?'var(--green)':pct>=50?'var(--yellow)':'var(--muted)';

  var h = '<div style="grid-column:1/-1">';

  // Header
  h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">';
  h += '<div><div style="font-size:18px;font-weight:700;color:var(--text)">'+dayName+' Rutini</div>';
  h += '<div style="font-size:12px;color:var(--muted)">'+dateStr+'</div></div>';
  h += '<div style="text-align:right">';
  h += '<div style="font-size:28px;font-weight:700;color:'+pctCol+'">'+pct+'%</div>';
  h += '<div style="font-size:11px;color:var(--muted)">'+doneItems+'/'+totalItems+' tamamlandı</div></div></div>';
  h += '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:12px">';
  h += '<div style="height:100%;width:'+pct+'%;background:'+pctCol+';border-radius:3px;transition:width .5s ease"></div></div>';
  if(pct===100) h += '<div style="text-align:center;margin-top:10px;font-size:14px;color:var(--green)">🎉 Tüm maddeler tamamlandı!</div>';
  h += '</div>';

  // Sections
  sections.forEach(function(k){
    var sec = RUTIN_ITEMS[k];
    var secDone = sec.items.filter(function(i){return checked[i.id];}).length;
    var secTotal = sec.items.length;
    var secPct = Math.round(secDone/secTotal*100);
    var secCol = secPct===100?'var(--green)':secPct>0?'var(--yellow)':'var(--muted)';

    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    h += '<div style="font-size:13px;font-weight:600;color:var(--text)">'+sec.label+'</div>';
    h += '<span style="font-size:11px;color:'+secCol+';font-weight:600">'+secDone+'/'+secTotal+'</span></div>';

    sec.items.forEach(function(item){
      var done = !!checked[item.id];
      var bgColor = done ? 'rgba(16,185,129,.06)' : 'rgba(255,255,255,.02)';
      var borderColor = done ? 'rgba(16,185,129,.2)' : 'rgba(255,255,255,.05)';
      var checkBorder = done ? 'var(--green)' : 'var(--muted)';
      var checkBg = done ? 'var(--green)' : 'transparent';
      var textColor = done ? 'var(--muted)' : 'var(--text)';
      var textDeco = done ? 'line-through' : 'none';
      var checkmark = done ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' : '';
      h += '<div onclick="toggleCheck(\'' + item.id + '\')" style="display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;background:' + bgColor + ';border:1px solid ' + borderColor + '">';
      h += '<div style="flex-shrink:0;width:20px;height:20px;border-radius:5px;border:2px solid ' + checkBorder + ';background:' + checkBg + ';display:flex;align-items:center;justify-content:center;margin-top:1px">' + checkmark + '</div>';
      h += '<span style="font-size:13px;color:' + textColor + ';line-height:1.5;text-decoration:' + textDeco + '">' + item.text + '</span>';
      h += '</div>';
    });
    h += '</div>';
  });

  // Hafta içi olduğunda haftalık bölümü de göster (katlanabilir)
  if(!isWeekend){
    var hSec = RUTIN_ITEMS['haftalik'];
    h += '<div style="background:rgba(59,130,246,.04);border:1px solid rgba(59,130,246,.15);border-radius:12px;padding:16px 20px;margin-bottom:10px">';
    h += '<div style="font-size:13px;font-weight:600;color:#60a5fa;margin-bottom:4px">'+hSec.label+'</div>';
    h += '<div style="font-size:11px;color:var(--muted)">Pazar akşamı yapılacaklar — şu an gösterim modunda</div></div>';
  }

  // Reset butonu
  h += '<div style="text-align:center;margin-top:6px">';
  h += '<button onclick="resetRutin()" style="background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer">🔄 Listeyi Sıfırla</button>';
  h += '</div>';

  h += '</div>';
  grid.innerHTML = h;
}

function addTicker(list){
  var inputId = list==='watch'?"newWatchTicker":"newPortTicker";
  var val = document.getElementById(inputId).value.trim().toUpperCase();
  if(!val) return;
  if(list==='watch' && !editWatchlist.includes(val)) editWatchlist.push(val);
  if(list==='port'  && !editPortfolio.includes(val)) editPortfolio.push(val);
  document.getElementById(inputId).value = "";
  renderEditLists();
}

function removeTicker(list, idx){
  if(list==='watch') editWatchlist.splice(idx,1);
  else editPortfolio.splice(idx,1);
  renderEditLists();
}

function saveListToGithub(){
  var token = document.getElementById("ghTokenInput").value.trim();
  if(!token){ setEditStatus("❌ Token gerekli — kutuya gir","red"); return; }
  localStorage.setItem('gh_token', token);

  var config = { watchlist: editWatchlist, portfolio: editPortfolio };
  var content = JSON.stringify(config, null, 2);
  var b64 = btoa(unescape(encodeURIComponent(content)));

  setEditStatus("💾 Kaydediliyor...","yellow");

  var apiUrl = "https://api.github.com/repos/ghurzzz/canslim/contents/config.json";
  var headers = {"Authorization":"token "+token,"Content-Type":"application/json"};

  // First get current SHA if exists
  fetch(apiUrl, {headers:headers})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(existing){
      var payload = {
        message: "Liste guncellendi " + new Date().toLocaleDateString("tr-TR"),
        content: b64
      };
      if(existing && existing.sha) payload.sha = existing.sha;

      return fetch(apiUrl, {
        method:"PUT",
        headers:headers,
        body:JSON.stringify(payload)
      });
    })
    .then(function(r){
      if(r.ok || r.status===201){
        setEditStatus("✅ Kaydedildi! Bir sonraki Colab çalıştırmasında aktif olur.","green");
        setTimeout(function(){closeEditPopup();},2000);
      } else {
        setEditStatus("❌ Hata: "+r.status+" — Tokenı kontrol et","red");
      }
    })
    .catch(function(e){ setEditStatus("❌ Hata: "+e.message,"red"); });
}

function setEditStatus(msg, color){
  var el = document.getElementById("editStatus");
  if(el){
    el.textContent = msg;
    el.style.color = color==="green"?"var(--green)":color==="red"?"var(--red2)":"var(--yellow)";
  }
}

  if(topEntry.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">🎯 En İyi Giriş Kalitesi</div>';
    var medals = ['🥇','🥈','🥉'];
    topEntry.forEach(function(r,i){
      var escol = r.entry_score>=75?'var(--green)':r.entry_score>=60?'var(--green2)':'var(--yellow)';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:5px" id="te-' + r.ticker + '">';
      h += '<span>' + medals[i] + ' <strong>' + r.ticker + '</strong> <span style="font-size:11px;color:var(--muted)">' + r.sinyal + '</span></span>';
      h += '<span style="font-weight:700;color:' + escol + '">' + r.entry_score + '/100</span></div>';
    });
    h += '</div>';
  }

  // Stop yakin
  var nearStop = data1d.filter(function(r){
    if(r.hata||!PORT.includes(r.ticker)||!r.stop) return false;
    return (r.fiyat-r.stop)/r.fiyat*100 < 8;
  }).sort(function(a,b){return (a.fiyat-a.stop)/a.fiyat-(b.fiyat-b.stop)/b.fiyat;});
  if(nearStop.length){
    h += '<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--red2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">⚠️ Stop Seviyesine Yakın</div>';
    nearStop.forEach(function(r){
      var dist = Math.round((r.fiyat-r.stop)/r.fiyat*1000)/10;
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:5px" id="ns-' + r.ticker + '">';
      h += '<strong>' + r.ticker + '</strong>';
      h += '<div style="text-align:right"><div style="font-size:12px;color:var(--red2);font-weight:600">Stop $' + r.stop + '</div><div style="font-size:10px;color:var(--muted)">Uzaklık: %' + dist + '</div></div></div>';
    });
    h += '</div>';
  }

  // Hedefe yakin
  var nearTarget = data1d.filter(function(r){
    if(r.hata||!PORT.includes(r.ticker)||!r.hedef) return false;
    return (r.hedef-r.fiyat)/r.fiyat*100 < 15;
  }).sort(function(a,b){return (a.hedef-a.fiyat)/a.fiyat-(b.hedef-b.fiyat)/b.fiyat;});
  if(nearTarget.length){
    h += '<div style="background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:#60a5fa;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">🎯 Hedefe Yakın</div>';
    nearTarget.forEach(function(r){
      var dist = Math.round((r.hedef-r.fiyat)/r.fiyat*1000)/10;
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:5px">';
      h += '<strong>' + r.ticker + '</strong>';
      h += '<div style="text-align:right"><div style="font-size:12px;color:#60a5fa;font-weight:600">Hedef $' + r.hedef + '</div><div style="font-size:10px;color:var(--muted)">Kaldi: %' + dist + '</div></div></div>';
    });
    h += '</div>';
  }

  // Earnings
  var urgentE = EARNINGS_DATA.filter(function(e){return e.days_to_earnings!=null&&e.days_to_earnings<=14;}).sort(function(a,b){return a.days_to_earnings-b.days_to_earnings;});
  if(urgentE.length){
    h += '<div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--yellow);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">📅 Yaklaşan Raporlar</div>';
    urgentE.forEach(function(e){
      var ic = e.alert==='red'?'🔴':'🟡';
      var inPort = PORT.includes(e.ticker);
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:5px">';
      h += '<span>' + ic + ' <strong>' + e.ticker + '</strong>' + (inPort?' <span style="color:var(--green);font-size:10px">P</span>':'') + '</span>';
      h += '<span style="color:var(--muted);font-size:11px">' + e.next_date + ' (' + e.days_to_earnings + ' gün)</span></div>';
    });
    h += '</div>';
  }

  // VIX
  var vix = md.VIX || {};
  if(vix.price){
    var vCol = vix.price>30?'var(--red2)':vix.price>20?'var(--yellow)':'var(--green)';
    var vLbl = vix.price>30?'Yüksek Korku — Yeni pozisyon açma':vix.price>20?'Orta Volatilite — Dikkatli ol':'Düşük Volatilite — Normal koşullar';
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">';
    h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">VIX</div><div style="font-size:12px;color:' + vCol + '">' + vLbl + '</div></div>';
    h += '<div style="font-size:28px;font-weight:700;color:' + vCol + '">' + vix.price + '</div></div>';
  }

  // Portfolyo detay
  if(port.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">💼 Portföy</div>';
    port.forEach(function(item){h += perfRow(item);});
    h += '</div>';
  }

  // Watchlist
  if(watch.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">👁 Watchlist</div>';
    watch.forEach(function(item){h += perfRow(item);});
    h += '</div>';
  }

  h += '</div>';
  grid.innerHTML = h;

  // Add onclick via JS (avoids quote nesting issues)
  bothBuy.forEach(function(r){
    var cnt = document.getElementById('bothBuyContainer');
    if(!cnt) return;
    var d = document.createElement('div');
    d.style.cssText = 'background:var(--bg3);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px 14px;cursor:pointer';
    d.innerHTML = '<div style="font-size:16px;font-weight:700;letter-spacing:2px;color:var(--green)">' + r.ticker + '</div><div style="font-size:10px;color:var(--muted)">Giris: ' + r.entry_score + '/100</div>';
    d.onclick = (function(t){return function(){openM(t);};})(r.ticker);
    cnt.appendChild(d);
  });
  topEntry.forEach(function(r){
    var el = document.getElementById('te-' + r.ticker);
    if(el) el.onclick = (function(t){return function(){openM(t);};})(r.ticker), el.style.cursor='pointer';
  });
  nearStop.forEach(function(r){
    var el = document.getElementById('ns-' + r.ticker);
    if(el) el.onclick = (function(t){return function(){openM(t);};})(r.ticker), el.style.cursor='pointer';
  });
}


function renderScreener(){
  var grid = document.getElementById('grid');
  var data = SCREENER_DATA || [];
  var criteria = [
    {id:'eps_qoq',    label:'EPS QoQ Büyüme',     limit:'>=20%',    w:3, imp:'critical'},
    {id:'sma200',     label:'SMA200 Üzerinde',     limit:'P>SMA200', w:3, imp:'critical'},
    {id:'market',     label:'M Kriteri',           limit:'Güçlü',    w:3, imp:'critical'},
    {id:'eps_accel',  label:'EPS Hızlanması',      limit:'Hızlanıyor',w:2, imp:'important'},
    {id:'rs_rating',  label:'RS Rating',           limit:'>=70',     w:2, imp:'important'},
    {id:'rev_growth', label:'Gelir Büyümesi',      limit:'>=15%',    w:2, imp:'important'},
    {id:'roe',        label:'ROE',                 limit:'>=15%',    w:2, imp:'important'},
    {id:'gross_mg',   label:'Brüt Marjin',         limit:'>=40%',    w:2, imp:'important'},
    {id:'sma50',      label:'SMA50 Üzerinde',      limit:'P>SMA50',  w:2, imp:'important'},
    {id:'52w',        label:'52H Yakınlık',        limit:'>=75%',    w:2, imp:'important'},
    {id:'net_mg',     label:'Net Marjin',          limit:'>=10%',    w:1, imp:'support'},
    {id:'de',         label:'Borç/Özkaynak',       limit:'<=1.0',    w:1, imp:'support'},
    {id:'cr',         label:'Current Ratio',       limit:'>=1.5',    w:1, imp:'support'},
    {id:'pe',         label:'P/E',                 limit:'<=60',     w:1, imp:'support'},
    {id:'mktcap',     label:'Piyasa Değeri',       limit:'>=1B',     w:1, imp:'support'},
    {id:'rel_vol',    label:'Göreceli Hacim',      limit:'>=0.8x',   w:1, imp:'support'},
    {id:'avg_vol',    label:'Ort. Hacim',          limit:'>=500K',   w:1, imp:'support'},
    {id:'inst_own',   label:'Kurumsal Sahiplik',   limit:'>=40%',    w:1, imp:'support'},
    {id:'inst_trend', label:'Kurumsal Trend',      limit:'Artıyor',  w:1, imp:'support'},
  ];
  var MAX_W = 35;

  if(!data.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Screener verisi yok — Actions Run Workflow</div>';
    return;
  }

  var passed = data.filter(function(r){return r.passed;});
  var failed = data.filter(function(r){return !r.passed;});
  var [expandedTicker, setExpanded] = [null, null];

  function impColor(imp){
    return imp==='critical'?'var(--red2)':imp==='important'?'var(--yellow)':'var(--muted)';
  }
  function impLabel(imp){
    return imp==='critical'?'🔴 ZORUNLU':imp==='important'?'🟡 ÖNEMLİ':'🔵 DESTEK';
  }

  function criteriaDetail(r){
    var h = '<div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);background:var(--bg3)">';
    h += '<div style="font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">KRİTER DETAYI — Ağırlıklı Skor: '+r.weighted_score+'/'+r.max_weighted+' (%'+r.pct+')</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">';
    criteria.forEach(function(c){
      var cr = r.criteria && r.criteria[c.id];
      if(!cr) return;
      var noData = cr.has_data === false;
      var col = noData ? 'var(--muted)' : cr.passed ? 'var(--green)' : impColor(c.imp);
      var bg = noData ? 'rgba(255,255,255,.02)' : cr.passed ? 'rgba(16,185,129,.06)' : (c.imp==='critical'?'rgba(239,68,68,.08)':c.imp==='important'?'rgba(245,158,11,.06)':'rgba(255,255,255,.02)');
      var bd = noData ? 'rgba(255,255,255,.05)' : cr.passed ? 'rgba(16,185,129,.2)' : (c.imp==='critical'?'rgba(239,68,68,.2)':c.imp==='important'?'rgba(245,158,11,.2)':'rgba(255,255,255,.05)');
      var icon = noData ? '⬜' : cr.passed ? '✅' : '❌';
      h += '<div style="background:'+bg+';border:1px solid '+bd+';border-radius:5px;padding:5px 8px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center">';
      h += '<span style="font-size:9px;color:'+col+'">'+icon+' '+c.label+'</span>';
      h += '<span style="font-size:9px;color:var(--muted)">'+impLabel(c.imp).split(' ')[0]+'</span></div>';
      h += '<div style="font-size:10px;font-weight:600;color:'+(noData?'var(--muted)':cr.passed?'var(--text)':col)+'">'+cr.val+' <span style="font-size:9px;color:var(--muted);font-weight:400">'+(!noData?'limit: ':'')+c.limit+'</span></div>';
      h += '</div>';
    });
    h += '</div></div>';
    return h;
  }

  function stockRow(r, expanded){
    var pct = r.pct;
    var col = pct>=80?'var(--green)':pct>=60?'var(--green2)':pct>=40?'var(--yellow)':'var(--red2)';
    var pb = r.in_portfolio?'<span style="color:var(--green);font-size:9px;font-weight:700;margin-left:4px">P</span>':'';
    var wb = r.in_watchlist?'<span style="color:#60a5fa;font-size:9px;font-weight:700;margin-left:4px">W</span>':'';
    var chgCol = r.change>=0?'var(--green2)':'var(--red2)';
    var critFail = criteria.filter(function(c){return r.criteria&&r.criteria[c.id]&&!r.criteria[c.id].passed&&c.imp==='critical';});
    var warnTags = critFail.map(function(c){
      return '<span style="background:rgba(239,68,68,.1);color:var(--red2);padding:1px 5px;border-radius:3px;font-size:9px;margin-right:3px">❌'+c.label+'</span>';
    }).join('');
    return '<div style="border-bottom:1px solid rgba(255,255,255,.04)" id="sc-row-'+r.ticker+'">'
      +'<div style="display:grid;grid-template-columns:130px 1fr 80px 80px;align-items:center;gap:10px;padding:10px 14px;cursor:pointer" id="sc-'+r.ticker+'">'
      +'<div><div style="font-weight:700;font-size:14px;letter-spacing:1px">'+r.ticker+pb+wb+'</div>'
      +'<div style="font-size:9px;color:var(--muted)">'+r.name.substring(0,18)+'</div></div>'
      +'<div><div style="height:4px;background:var(--bg3);border-radius:2px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:2px"></div></div>'
      +'<div style="display:flex;align-items:center;gap:4px;margin-top:3px">'+warnTags
      +'<span style="font-size:9px;color:var(--muted)">'+r.score+'/19</span>'
      +'<span style="background:rgba(59,130,246,.15);color:#60a5fa;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600">RS:'+r.rs_rating+'</span>'
      +'</div></div>'
      +'<div style="text-align:right"><div style="font-weight:700;color:'+col+';font-size:15px">'+pct+'%</div>'
      +'<div style="font-size:9px;color:var(--muted)">ağırlıklı</div></div>'
      +'<div style="text-align:right"><div style="font-weight:600">$'+r.price+'</div>'
      +'<div style="font-size:11px;color:'+chgCol+'">'+(r.change>=0?'+':'')+r.change+'%</div></div>'
      +'</div>'
      +(expanded ? criteriaDetail(r) : '')
      +'</div>';
  }

  function buildHTML(){
    var h = '<div style="grid-column:1/-1">';

    // Summary
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
    h += '<div style="font-size:16px;font-weight:700;margin-bottom:4px">🔍 CANSLIM Screener</div>';
    h += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">16 kriter · 3 önem seviyesi · '+data.length+' hisse tarandı</div>';
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">';
    h += '<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--green)">'+passed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçti</div></div>';
    h += '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--red2)">'+failed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçemedi</div></div>';
    h += '<div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:#60a5fa">'+data.filter(function(r){return r.in_watchlist||r.in_portfolio;}).length+'</div><div style="font-size:10px;color:var(--muted)">Listemde</div></div>';
    h += '</div>';
    // Legend
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10px">';
    h += '<span>🔴 <strong>Zorunlu</strong> (3x): EPS QoQ, SMA200, M Kriteri</span>';
    h += '<span>🟡 <strong>Önemli</strong> (2x): Gelir, ROE, Marjin, SMA50, 52H</span>';
    h += '<span>🔵 <strong>Destek</strong> (1x): Diğerleri</span>';
    h += '</div></div>';

    // Geçenler
    if(passed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(16,185,129,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--green);letter-spacing:2px;text-transform:uppercase">✅ CANSLIM Geçti ('+passed.length+')</div>';
      passed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    // Watchlist/Portfolio (geçemeyenler)
    var myFailed = failed.filter(function(r){return r.in_watchlist||r.in_portfolio;});
    if(myFailed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(59,130,246,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:#60a5fa;letter-spacing:2px;text-transform:uppercase">📋 Listemde (Geçemedi, '+myFailed.length+')</div>';
      myFailed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    h += '</div>';
    return h;
  }

  grid.innerHTML = buildHTML();

  // onclick handlers
  data.forEach(function(r){
    var el = document.getElementById('sc-'+r.ticker);
    if(el){
      el.onclick = function(e){
        e.stopPropagation();
        if(expandedTicker===r.ticker){ expandedTicker=null; }
        else { expandedTicker=r.ticker; }
        grid.innerHTML = buildHTML();
        // Re-attach handlers
        data.forEach(function(r2){
          var el2 = document.getElementById('sc-'+r2.ticker);
          if(el2) el2.onclick = arguments.callee.bind({ticker:r2.ticker});
        });
        attachHandlers();
      };
    }
  });

  function attachHandlers(){
    data.forEach(function(r){
      var el = document.getElementById('sc-'+r.ticker);
      if(!el) return;
      el.onclick = (function(ticker){
        return function(e){
          e.stopPropagation();
          expandedTicker = expandedTicker===ticker ? null : ticker;
          grid.innerHTML = buildHTML();
          attachHandlers();
        };
      })(r.ticker);
    });
  }
  attachHandlers();
}
</script>
