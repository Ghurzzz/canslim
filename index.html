<script>
// ── Değerleme tooltip ────────────────────────────────────────────────────────
(function(){
  var tip = null;
  function getOrCreateTip(){
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'val-tooltip';
      tip.style.cssText = 'position:fixed;background:#1e293b;border:1px solid #374151;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:11px;line-height:1.7;max-width:280px;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none';
      document.body.appendChild(tip);
    }
    return tip;
  }
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest('.val-tip');
    if(!el) return;
    var parts = el.getAttribute('data-tip').split('||');
    var t = getOrCreateTip();
    t.innerHTML = '<strong style="color:#60a5fa">'+parts[0]+'</strong><br>'+parts[1]+'<br><br><span style="color:#f59e0b">'+parts[2]+'</span>';
    t.style.display = 'block';
    t.style.left = Math.min(e.clientX+14, window.innerWidth-300)+'px';
    t.style.top = Math.max(e.clientY-10, 10)+'px';
  });
  document.addEventListener('mousemove', function(e){
    if(!tip || tip.style.display==='none') return;
    if(!e.target.closest('.val-tip')){ tip.style.display='none'; return; }
    tip.style.left = Math.min(e.clientX+14, window.innerWidth-300)+'px';
    tip.style.top = Math.max(e.clientY-10, 10)+'px';
  });
  document.addEventListener('mouseout', function(e){
    if(!e.target.closest('.val-tip')) return;
    if(!e.relatedTarget || !e.relatedTarget.closest('.val-tip')){
      if(tip) tip.style.display='none';
    }
  });
})();
</script>

function ib(key,label){

}

function setTab(t,el){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active");});
  el.classList.add("active");
  var tfRow=document.getElementById("tfRow");
  if(tfRow) tfRow.style.display=(t==="dashboard"||t==="earnings"||t==="rutin"||t==="haftalik"||t==="screener"||t==="valuation"||t==="direction")?"none":"flex";
  if(t==="dashboard") renderDashboard();
  else if(t==="port") renderPortfolio();
  else if(t==="earnings") renderEarnings();
  else if(t==="haftalik") renderHaftalik();
  else if(t==="screener") renderScreener();
  else if(t==="valuation") renderValuation();
  else if(t==="direction") renderDirection();
  else if(t==="minervini") renderMinervini();
  else {
    var g=document.getElementById('grid');
    if(g){g.style.display='';g.style.width='';}
    renderGrid();
  }
}

function setTf(tf,el){
  curTf=tf;
  document.querySelectorAll(".tf-btn").forEach(function(b){b.classList.toggle("active",b.dataset.tf===tf);});
  curData=(TF_DATA[tf]||TF_DATA["1d"]).slice();
  renderStats();
  renderGrid();
}

function filtered(){
  var d=curData.filter(function(r){return !r.hata;});
  if(curTab==="port") return d.filter(function(r){return PORT.includes(r.ticker);});
  if(curTab==="buy") return d.filter(function(r){return r.sinyal==="GUCLU AL"||r.sinyal==="AL";});
  if(curTab==="sell") return d.filter(function(r){return r.sinyal==="SAT";});
  return d;
}

function renderStats(){

  var cnt={};

  document.getElementById("stats").innerHTML=

function loadPortCost(){
  try{ var d=localStorage.getItem('port_cost'); return d?JSON.parse(d):{} }catch(e){return {};}
}
function savePortCost(data){
  try{ localStorage.setItem('port_cost', JSON.stringify(data)); }catch(e){}
}
function updatePortCost(ticker, field, value){
  var d = loadPortCost();
  if(!d[ticker]) d[ticker] = {cost:0, lot:0};
  d[ticker][field] = parseFloat(value)||0;
  savePortCost(d);
  // PORT_COST'u da güncelle (anlık hesaplama için)
  if(typeof PORT_COST !== 'undefined'){
    if(!PORT_COST[ticker]) PORT_COST[ticker] = {cost:0, lot:0};
    PORT_COST[ticker][field] = parseFloat(value)||0;
  }
  renderPortfolio();
}

    var bg=idx%2===0?'var(--bg)':'rgba(255,255,255,.015)';
    var dc=r.degisim>=0?'var(--green2)':'var(--red2)';

    var tt=0;
    if(r.above50) tt++;
    if(r.sma200&&r.fiyat>r.sma200*0.97) tt++;
    if(r.above200) tt++;
    if(r.sma50&&r.sma200&&r.sma50>r.sma200) tt++;
    if(r.sma200>0) tt++;
    if(r.low52w&&r.fiyat>=r.low52w*1.30) tt++;
    if(r.pct_from_52w!==undefined&&r.pct_from_52w<=25) tt++;
    if(r.gain_6m!==undefined&&r.gain_6m>=20) tt++;
    var ttCol=tt>=8?'var(--green)':tt>=7?'var(--green2)':tt>=6?'var(--yellow)':'var(--red2)';

    var stopLvl=r.sma50?(r.sma50*0.93):null;
    var stopCol=stopLvl&&r.fiyat<stopLvl*1.05?'var(--red2)':'var(--muted)';

    var pl='',plPct='',plCol='var(--muted)',durStr='',durCol='var(--muted)';
    if(cost>0&&lot>0){
      var posVal=r.fiyat*lot, posCost=cost*lot;
      var plVal=posVal-posCost, plPctVal=(posVal-posCost)/posCost*100;
      var plSign=plVal>=0?'+':'';
      plCol=plVal>=0?'var(--green)':'var(--red2)';
      pl=plSign+'$'+Math.abs(plVal).toFixed(0);
      plPct=plSign+plPctVal.toFixed(1)+'%';
      if(stopLvl&&r.fiyat<=stopLvl){durStr='&#x1F534; STOP';durCol='var(--red2)';}
      else if(stopLvl&&r.fiyat<=stopLvl*1.05){durStr='&#x26A0; Dikkat';durCol='var(--yellow)';}
      else if(tt>=7&&plPctVal>=20){durStr='&#x1F4CA; Piramit?';durCol='var(--green2)';}
      else if(tt>=7){durStr='&#x1F7E2; Tut';durCol='var(--green)';}
      else if(tt>=5){durStr='&#x1F7E1; Gozle';durCol='var(--yellow)';}
      else{durStr='&#x1F534; Zayif';durCol='var(--red2)';}
    } else {
      durStr='&#x270F; Maliyet gir';durCol='var(--muted)';
    }

    h+='<tr style="background:'+bg+';border-bottom:1px solid rgba(255,255,255,.03)">';
    h+='<td style="padding:10px 14px;font-weight:700;color:var(--green)">'+r.ticker+'</td>';
    h+='<td style="text-align:right;padding:8px;font-weight:600">$'+r.fiyat+'</td>';
    h+='<td style="text-align:right;padding:8px;color:'+dc+'">'+(r.degisim>=0?'+':'')+r.degisim+'%</td>';
    h+='<td style="text-align:right;padding:8px"><span style="background:rgba(16,185,129,.1);color:'+ttCol+';border-radius:4px;padding:2px 6px;font-weight:700">'+tt+'/8</span></td>';
    h+='<td style="text-align:right;padding:8px;color:'+stopCol+'">'+(stopLvl?'$'+stopLvl.toFixed(1):'—')+'</td>';
    h+='<td style="text-align:right;padding:6px 8px"><input type="number" value="'+(cost||'')+'" placeholder="0.00" onchange="updatePortCost(\''+r.ticker+'\',\'cost\',this.value)" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 6px;font-size:11px;text-align:right;font-family:inherit"></td>';
    h+='<td style="text-align:right;padding:6px 8px"><input type="number" value="'+(lot||'')+'" placeholder="0" onchange="updatePortCost(\''+r.ticker+'\',\'lot\',this.value)" style="width:55px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 6px;font-size:11px;text-align:right;font-family:inherit"></td>';
    h+='<td style="text-align:right;padding:8px;color:'+plCol+';font-weight:600">'+(pl||'—')+'</td>';
    h+='<td style="text-align:right;padding:8px;color:'+plCol+';font-weight:600">'+(plPct||'—')+'</td>';
    h+='<td style="text-align:right;padding:8px;color:'+durCol+';font-weight:600;font-size:11px">'+durStr+'</td>';
    h+='</tr>';
  });

  h+='</tbody></table></div>';
  h+='<div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap">';
  h+='<span>&#x1F7E2; Tut = TT 7+</span><span>&#x1F4CA; Piramit = TT 7+ ve %20+ kar</span><span>&#x1F7E1; Gozle = TT 5-6</span><span>&#x26A0; Dikkat = Stop yakin</span><span>&#x1F534; STOP = Cik</span>';
  h+='</div></div>';

  if(!data.length) h+='<div style="text-align:center;padding:40px;color:var(--muted)">Portfoyunuzde hisse yok.</div>';
  h+='</div>';
  grid.innerHTML=h;
}

function buildCard(r){
  var ss=SS[r.sinyal]||SS["DIKKAT"];
  var dc=r.degisim>=0?"var(--green2)":"var(--red2)";
  var ds=(r.degisim>=0?"+":"")+r.degisim+"%";
  var escol=r.entry_score>=75?"var(--green)":r.entry_score>=60?"var(--green2)":r.entry_score>=45?"var(--yellow)":r.entry_score>=30?"var(--red2)":"var(--red)";
  var pvcol=r.price_vs_color==="green"?"var(--green)":r.price_vs_color==="yellow"?"var(--yellow)":"var(--red2)";
  var sigs=[
    {l:"Trend",v:r.trend==="Yukselen"?"Yukseliyor":r.trend==="Dusen"?"Dusuyor":"Yatay",g:r.trend==="Yukselen"?true:r.trend==="Dusen"?false:null},
    {l:"SMA50",v:r.above50?"Uzerinde":"Altinda",g:r.above50},
    {l:"SMA200",v:r.above200?"Uzerinde":"Altinda",g:r.above200},
    {l:"RSI",v:r.rsi||"?",g:r.rsi?r.rsi<30?true:r.rsi>70?false:null:null},
    {l:"52W",v:"%"+r.pct_from_52w+" uzak",g:r.near_52w}

    +'<div class="accent" style="background:linear-gradient(90deg,'+ss.ac+','+ss.ac+'88)"></div>'

    +'<div class="cpr"><div class="pval">$'+r.fiyat+'</div><div class="pchg" style="color:'+dc+'">'+ds+'</div>'
    +(r.pe_fwd?'<div style="font-size:9px;color:var(--muted)">FwdPE:'+r.pe_fwd.toFixed(1)+'</div>':'')
    +'</div></div><div class="sigs">'+sigs+'</div>'

    +'<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:var(--muted)">Giris Kalitesi</span><span style="font-size:11px;font-weight:700;color:'+escol+'">'+r.entry_score+'/100</span></div>'

    +'<div style="display:flex;justify-content:space-between;margin-top:3px"><span style="font-size:9px;color:'+escol+'">'+r.entry_label+'</span><span style="font-size:9px;color:'+pvcol+'">'+r.price_vs_ideal+'</span></div>'

    +'<div class="lv"><div class="ll">Hemen Gir</div><div class="lval" style="color:var(--green2)">$'+r.entry_aggressive+'</div></div>'

function openM(ticker){
  var r=curData.find(function(d){return d.ticker===ticker;});
  if(!r||r.hata) return;
  if(mChart){mChart.destroy();mChart=null;}
  var ss=SS[r.sinyal]||SS["DIKKAT"];

function getTodayKey(){
  return new Date().toDateString();
}

function loadChecked(){
  try{
    var data = localStorage.getItem('rutin_checked');
    if(!data) return {};
    var parsed = JSON.parse(data);
    // Sadece bugünün verilerini kullan
    if(parsed.date !== getTodayKey()) return {};
    return parsed.items || {};
  }catch(e){return {};}
}

function saveChecked(checked){
  localStorage.setItem('rutin_checked', JSON.stringify({
    date: getTodayKey(),
    items: checked
  }));
}

function toggleCheck(id){
  var checked = loadChecked();
  if(checked[id]) delete checked[id];
  else checked[id] = true;
  saveChecked(checked);
  renderRutin();
}

function resetRutin(){
  localStorage.removeItem('rutin_checked');
  renderRutin();
}

  var sp = md.SP500 || {};

  h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">';

  });

    var secTotal = sec.items.length;
    var secPct = Math.round(secDone/secTotal*100);
    var secCol = secPct===100?'var(--green)':secPct>0?'var(--yellow)':'var(--muted)';

    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px">';

      var bgColor = done ? 'rgba(16,185,129,.06)' : 'rgba(255,255,255,.02)';
      var borderColor = done ? 'rgba(16,185,129,.2)' : 'rgba(255,255,255,.05)';
      var checkBorder = done ? 'var(--green)' : 'var(--muted)';
      var checkBg = done ? 'var(--green)' : 'transparent';

      h += '</div>';
    });
    h += '</div>';
  });

  // Hafta içi olduğunda haftalık bölümü de göster (katlanabilir)
  if(!isWeekend){
    var hSec = RUTIN_ITEMS['haftalik'];
    h += '<div style="background:rgba(59,130,246,.04);border:1px solid rgba(59,130,246,.15);border-radius:12px;padding:16px 20px;margin-bottom:10px">';
    h += '<div style="font-size:13px;font-weight:600;color:#60a5fa;margin-bottom:4px">'+hSec.label+'</div>';
    h += '<div style="font-size:11px;color:var(--muted)">Pazar akşamı yapılacaklar — şu an gösterim modunda</div></div>';
  }

  // Reset butonu
  h += '<div style="text-align:center;margin-top:6px">';
  h += '<button onclick="resetRutin()" style="background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer">🔄 Listeyi Sıfırla</button>';
  h += '</div>';

  h += '</div>';
  return h;
}

function addTicker(list){
  var inputId = list==='watch'?"newWatchTicker":"newPortTicker";
  var val = document.getElementById(inputId).value.trim().toUpperCase();
  if(!val) return;
  if(list==='watch' && !editWatchlist.includes(val)) editWatchlist.push(val);
  if(list==='port'  && !editPortfolio.includes(val)) editPortfolio.push(val);
  document.getElementById(inputId).value = "";
  renderEditLists();
}

function removeTicker(list, idx){
  if(list==='watch') editWatchlist.splice(idx,1);
  else editPortfolio.splice(idx,1);
  renderEditLists();
}

function saveListToGithub(){
  var token = document.getElementById("ghTokenInput").value.trim();
  if(!token){ setEditStatus("❌ Token gerekli — kutuya gir","red"); return; }
  localStorage.setItem('gh_token', token);

  var config = { watchlist: editWatchlist, portfolio: editPortfolio, portfolio_cost: editPortfolioCost };
  var content = JSON.stringify(config, null, 2);
  var b64 = btoa(unescape(encodeURIComponent(content)));

  setEditStatus("💾 Kaydediliyor...","yellow");

  var apiUrl = "https://api.github.com/repos/ghurzzz/canslim/contents/config.json";
  var headers = {"Authorization":"token "+token,"Content-Type":"application/json"};

  // First get current SHA if exists
  fetch(apiUrl, {headers:headers})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(existing){
      var payload = {
        message: "Liste guncellendi " + new Date().toLocaleDateString("tr-TR"),
        content: b64
      };
      if(existing && existing.sha) payload.sha = existing.sha;

      return fetch(apiUrl, {
        method:"PUT",
        headers:headers,
        body:JSON.stringify(payload)
      });
    })
    .then(function(r){
      if(r.ok || r.status===201){
        setEditStatus("✅ Kaydedildi! Bir sonraki Colab çalıştırmasında aktif olur.","green");
        setTimeout(function(){closeEditPopup();},2000);
      } else {
        setEditStatus("❌ Hata: "+r.status+" — Tokenı kontrol et","red");
      }
    })
    .catch(function(e){ setEditStatus("❌ Hata: "+e.message,"red"); });
}

function setEditStatus(msg, color){

  if(el){
    el.textContent = msg;
    el.style.color = color==="green"?"var(--green)":color==="red"?"var(--red2)":"var(--yellow)";
  }
}

  // VIX

    h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">VIX</div><div style="font-size:12px;color:' + vCol + '">' + vLbl + '</div></div>';
    h += '<div style="font-size:28px;font-weight:700;color:' + vCol + '">' + vix.price + '</div></div>';
  }

  // Portfolyo detay
  if(port.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">💼 Portföy</div>';
    port.forEach(function(item){h += perfRow(item);});
    h += '</div>';

  // Watchlist
  if(watch.length){
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">';
    h += '<div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">👁 Watchlist</div>';
    watch.forEach(function(item){h += perfRow(item);});
    h += '</div>';
  }

  h += '</div>';
  grid.innerHTML = h;

  // Add onclick via JS (avoids quote nesting issues)
  bothBuy.forEach(function(r){
    var cnt = document.getElementById('bothBuyContainer');
    if(!cnt) return;
    var d = document.createElement('div');
    d.style.cssText = 'background:var(--bg3);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px 14px;cursor:pointer';
    d.innerHTML = '<div style="font-size:16px;font-weight:700;letter-spacing:2px;color:var(--green)">' + r.ticker + '</div><div style="font-size:10px;color:var(--muted)">Giris: ' + r.entry_score + '/100</div>';
    d.onclick = (function(t){return function(){openM(t);};})(r.ticker);
    cnt.appendChild(d);
  });
  topEntry.forEach(function(r){

    if(el) el.onclick = (function(t){return function(){openM(t);};})(r.ticker), el.style.cursor='pointer';
  });
}


function renderScreener(){
  var grid = document.getElementById('grid');
  var data = SCREENER_DATA || [];
  var criteria = [
    {id:'eps_qoq',    label:'EPS QoQ Büyüme',     limit:'>=20%',    w:3, imp:'critical'},
    {id:'sma200',     label:'SMA200 Üzerinde',     limit:'P>SMA200', w:3, imp:'critical'},
    {id:'market',     label:'M Kriteri',           limit:'Güçlü',    w:3, imp:'critical'},
    {id:'eps_accel',  label:'EPS Hızlanması',      limit:'Hızlanıyor',w:2, imp:'important'},
    {id:'rs_rating',  label:'RS Rating',           limit:'>=70',     w:2, imp:'important'},
    {id:'rev_growth', label:'Gelir Büyümesi',      limit:'>=15%',    w:2, imp:'important'},
    {id:'roe',        label:'ROE',                 limit:'>=15%',    w:2, imp:'important'},
    {id:'gross_mg',   label:'Brüt Marjin',         limit:'>=40%',    w:2, imp:'important'},
    {id:'sma50',      label:'SMA50 Üzerinde',      limit:'P>SMA50',  w:2, imp:'important'},
    {id:'52w',        label:'52H Yakınlık',        limit:'>=75%',    w:2, imp:'important'},
    {id:'net_mg',     label:'Net Marjin',          limit:'>=10%',    w:1, imp:'support'},
    {id:'de',         label:'Borç/Özkaynak',       limit:'<=1.0',    w:1, imp:'support'},
    {id:'cr',         label:'Current Ratio',       limit:'>=1.5',    w:1, imp:'support'},
    {id:'pe',         label:'P/E',                 limit:'<=60',     w:1, imp:'support'},
    {id:'mktcap',     label:'Piyasa Değeri',       limit:'>=1B',     w:1, imp:'support'},
    {id:'rel_vol',    label:'Göreceli Hacim',      limit:'>=0.8x',   w:1, imp:'support'},
    {id:'avg_vol',    label:'Ort. Hacim',          limit:'>=500K',   w:1, imp:'support'},
    {id:'inst_own',   label:'Kurumsal Sahiplik',   limit:'>=40%',    w:1, imp:'support'},
    {id:'inst_trend', label:'Kurumsal Trend',      limit:'Artıyor',  w:1, imp:'support'},
  ];
  var MAX_W = 35;

  if(!data.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Screener verisi yok — Actions Run Workflow</div>';
    return;
  }

  var passed = data.filter(function(r){return r.passed;});
  var failed = data.filter(function(r){return !r.passed;});
  var [expandedTicker, setExpanded] = [null, null];

  function impColor(imp){
    return imp==='critical'?'var(--red2)':imp==='important'?'var(--yellow)':'var(--muted)';
  }
  function impLabel(imp){
    return imp==='critical'?'🔴 ZORUNLU':imp==='important'?'🟡 ÖNEMLİ':'🔵 DESTEK';
  }

  function criteriaDetail(r){
    var h = '<div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);background:var(--bg3)">';
    h += '<div style="font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">KRİTER DETAYI — Ağırlıklı Skor: '+r.weighted_score+'/'+r.max_weighted+' (%'+r.pct+')</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">';
    criteria.forEach(function(c){
      var cr = r.criteria && r.criteria[c.id];
      if(!cr) return;
      var noData = cr.has_data === false;
      var col = noData ? 'var(--muted)' : cr.passed ? 'var(--green)' : impColor(c.imp);
      var bg = noData ? 'rgba(255,255,255,.02)' : cr.passed ? 'rgba(16,185,129,.06)' : (c.imp==='critical'?'rgba(239,68,68,.08)':c.imp==='important'?'rgba(245,158,11,.06)':'rgba(255,255,255,.02)');
      var bd = noData ? 'rgba(255,255,255,.05)' : cr.passed ? 'rgba(16,185,129,.2)' : (c.imp==='critical'?'rgba(239,68,68,.2)':c.imp==='important'?'rgba(245,158,11,.2)':'rgba(255,255,255,.05)');
      var icon = noData ? '⬜' : cr.passed ? '✅' : '❌';
      h += '<div style="background:'+bg+';border:1px solid '+bd+';border-radius:5px;padding:5px 8px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center">';
      h += '<span style="font-size:9px;color:'+col+'">'+icon+' '+c.label+'</span>';
      h += '<span style="font-size:9px;color:var(--muted)">'+impLabel(c.imp).split(' ')[0]+'</span></div>';
      h += '<div style="font-size:10px;font-weight:600;color:'+(noData?'var(--muted)':cr.passed?'var(--text)':col)+'">'+cr.val+' <span style="font-size:9px;color:var(--muted);font-weight:400">'+(!noData?'limit: ':'')+c.limit+'</span></div>';
      h += '</div>';
    });
    h += '</div></div>';
    return h;
  }

  function stockRow(r, expanded){
    var pct = r.pct;
    var col = pct>=80?'var(--green)':pct>=60?'var(--green2)':pct>=40?'var(--yellow)':'var(--red2)';
    var pb = r.in_portfolio?'<span style="color:var(--green);font-size:9px;font-weight:700;margin-left:4px">P</span>':'';
    var wb = r.in_watchlist?'<span style="color:#60a5fa;font-size:9px;font-weight:700;margin-left:4px">W</span>':'';
    var chgCol = r.change>=0?'var(--green2)':'var(--red2)';
    var critFail = criteria.filter(function(c){return r.criteria&&r.criteria[c.id]&&!r.criteria[c.id].passed&&c.imp==='critical';});
    var warnTags = critFail.map(function(c){
      return '<span style="background:rgba(239,68,68,.1);color:var(--red2);padding:1px 5px;border-radius:3px;font-size:9px;margin-right:3px">❌'+c.label+'</span>';
    }).join('');
    return '<div style="border-bottom:1px solid rgba(255,255,255,.04)" id="sc-row-'+r.ticker+'">'
      +'<div style="display:grid;grid-template-columns:130px 1fr 80px 80px;align-items:center;gap:10px;padding:10px 14px;cursor:pointer" id="sc-'+r.ticker+'">'
      +'<div><div style="font-weight:700;font-size:14px;letter-spacing:1px">'+r.ticker+pb+wb+'</div>'
      +'<div style="font-size:9px;color:var(--muted)">'+r.name.substring(0,18)+'</div></div>'
      +'<div><div style="height:4px;background:var(--bg3);border-radius:2px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:2px"></div></div>'
      +'<div style="display:flex;align-items:center;gap:4px;margin-top:3px">'+warnTags
      +'<span style="font-size:9px;color:var(--muted)">'+r.score+'/19</span>'
      +'<span style="background:rgba(59,130,246,.15);color:#60a5fa;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600">RS:'+r.rs_rating+'</span>'
      +'</div></div>'
      +'<div style="text-align:right"><div style="font-weight:700;color:'+col+';font-size:15px">'+pct+'%</div>'
      +'<div style="font-size:9px;color:var(--muted)">ağırlıklı</div></div>'
      +'<div style="text-align:right"><div style="font-weight:600">$'+r.price+'</div>'
      +'<div style="font-size:11px;color:'+chgCol+'">'+(r.change>=0?'+':'')+r.change+'%</div></div>'
      +'</div>'
      +(expanded ? criteriaDetail(r) : '')
      +'</div>';
  }

  function buildHTML(){
    var h = '<div style="grid-column:1/-1">';

    // Summary
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:14px">';
    h += '<div style="font-size:16px;font-weight:700;margin-bottom:4px">🔍 CANSLIM Screener</div>';
    h += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">16 kriter · 3 önem seviyesi · '+data.length+' hisse tarandı</div>';
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">';
    h += '<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--green)">'+passed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçti</div></div>';
    h += '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--red2)">'+failed.length+'</div><div style="font-size:10px;color:var(--muted)">Geçemedi</div></div>';
    h += '<div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:#60a5fa">'+data.filter(function(r){return r.in_watchlist||r.in_portfolio;}).length+'</div><div style="font-size:10px;color:var(--muted)">Listemde</div></div>';
    h += '</div>';
    // Legend
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10px">';
    h += '<span>🔴 <strong>Zorunlu</strong> (3x): EPS QoQ, SMA200, M Kriteri</span>';
    h += '<span>🟡 <strong>Önemli</strong> (2x): Gelir, ROE, Marjin, SMA50, 52H</span>';
    h += '<span>🔵 <strong>Destek</strong> (1x): Diğerleri</span>';
    h += '</div></div>';

    // Geçenler
    if(passed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(16,185,129,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--green);letter-spacing:2px;text-transform:uppercase">✅ CANSLIM Geçti ('+passed.length+')</div>';
      passed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    // Watchlist/Portfolio (geçemeyenler)
    var myFailed = failed.filter(function(r){return r.in_watchlist||r.in_portfolio;});
    if(myFailed.length){
      h += '<div style="background:var(--bg2);border:1px solid rgba(59,130,246,.2);border-radius:12px;overflow:hidden;margin-bottom:14px">';
      h += '<div style="padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:#60a5fa;letter-spacing:2px;text-transform:uppercase">📋 Listemde (Geçemedi, '+myFailed.length+')</div>';
      myFailed.forEach(function(r){ h += stockRow(r, r.ticker===expandedTicker); });
      h += '</div>';
    }

    h += '</div>';
    return h;
  }

  grid.innerHTML = buildHTML();

  // onclick handlers
  data.forEach(function(r){
    var el = document.getElementById('sc-'+r.ticker);
    if(el){
      el.onclick = function(e){
        e.stopPropagation();
        if(expandedTicker===r.ticker){ expandedTicker=null; }
        else { expandedTicker=r.ticker; }
        grid.innerHTML = buildHTML();
        // Re-attach handlers
        data.forEach(function(r2){
          var el2 = document.getElementById('sc-'+r2.ticker);
          if(el2) el2.onclick = arguments.callee.bind({ticker:r2.ticker});
        });
        attachHandlers();
      };
    }
  });

  function attachHandlers(){
    data.forEach(function(r){
      var el = document.getElementById('sc-'+r.ticker);
      if(!el) return;
      el.onclick = (function(ticker){
        return function(e){
          e.stopPropagation();
          expandedTicker = expandedTicker===ticker ? null : ticker;
          grid.innerHTML = buildHTML();
          attachHandlers();
        };
      })(r.ticker);
    });
  }
  attachHandlers();
}

    var score = 0; var details = [];

    if(c2) score++;

    if(c3) score++;

    details.push({label:'SMA50 > SMA200 (Altin Carpaz)', pass:c4, val: c4 ? 'Evet' : 'Hayir', tip:'50 gunluk ortalama 200 gunlugun uzerinde. Boga piyasasinin teknik dogrulamasi.'});

    var low52pct = r.low52w ? Math.round((r.fiyat - r.low52w) / r.low52w * 100) : 0;

    return {score: score, details: details};

  h += '<div style="font-size:12px;font-weight:600;color:#60a5fa;margin-bottom:10px">Bu sayfayi nasil okumaliyim?</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;font-size:11px;color:#94a3b8;line-height:1.7">';
  h += '<div><strong style="color:var(--text)">1. Renklere bak:</strong> Yesil=iyi, Sari=dikkat, Kirmizi=zayif. Satir cogunlukla yesil = guclu hisse.</div>';
  h += '<div><strong style="color:var(--text)">2. EPS ve Gelir oncelikli:</strong> CANSLIM metodolojisinde en kritik iki metrik. Bu ikisi kirmiziysa diger metrikler ikinci plana dusuyor.</div>';
  h += '<div><strong style="color:var(--text)">3. PEG en dengeli:</strong> 1 alti ucuz, 1-2 makul, 2 ustu pahali. Hem buyumeyi hem fiyati birlikte degerlendirir.</div>';
  h += '<div><strong style="color:var(--text)">4. Analist Hedefi:</strong> Mevcut fiyattan yuksekse yesil. Kurumların beklentisini gosterir, tek basina alim sinyali degildir.</div>';
  h += '<div><strong style="color:var(--text)">5. Sutun basligina gel:</strong> Her metrik sutununun basligindaki mavi ikon uzerine fare ile gelince aciklama cikar.</div>';
  h += '</div></div>';

  // Tablo
  h += '<div style="width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:700px">';
  h += '<thead><tr style="background:var(--bg2)">';
  h += '<th style="text-align:left;padding:10px;color:var(--muted);font-weight:600">Hisse</th>';
  h += '<th style="text-align:right;padding:10px 8px;color:var(--muted);font-weight:600">Fiyat</th>';

  metrics.forEach(function(mm){
    var tipData = mm.label + '||' + mm.desc + '||' + mm.ideal;
    h += '<th style="text-align:right;padding:8px 4px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:10px">';
    h += mm.label;
    h += '<span class="val-tip" data-tip="' + tipData + '" style="cursor:help;width:14px;height:14px;border-radius:50%;background:rgba(96,165,250,.2);color:#60a5fa;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:3px;vertical-align:middle">?</span>';
    h += '</th>';
  });
  h += '</tr></thead><tbody>';

  rows.forEach(function(r,i){
    var bg=i%2===0?'var(--bg)':'rgba(255,255,255,.02)';
    var inP=r.portfolio;
    h += '<tr style="background:'+bg+';border-bottom:1px solid rgba(255,255,255,.03)">';
    h += '<td style="padding:10px;font-weight:700;color:'+(inP?'var(--green)':'var(--text)')+'">'+r.ticker;
    if(inP) h += '<span style="font-size:8px;background:rgba(16,185,129,.15);color:var(--green);padding:1px 4px;border-radius:3px;margin-left:4px">P</span>';
    h += '</td>';
    h += '<td style="text-align:right;padding:8px 4px;font-weight:600;font-size:10px">$'+r.fiyat+'</td>';
    metrics.forEach(function(mm){
      var val = mm.key==='analyst_target' ? r.fair_price_analyst : r[mm.key];
      var col = mm.key==='analyst_target'
        ? (r.fair_price_analyst&&r.fair_price_analyst>r.fiyat?'var(--green)':'var(--red2)')
        : colOf(val,mm.lo,mm.hi,mm.hb);
      h += '<td style="text-align:right;padding:10px 8px;color:'+col+'">'+fmtV(val,mm.fmt,r.fiyat)+'</td>';
    });
    h += '</tr>';
  });

  h += '</tbody></table>';
  h += '<div style="display:flex;gap:16px;margin-top:10px;font-size:10px;color:var(--muted)">';
  h += '<span><span style="color:var(--green)">&#9679;</span> Iyi</span>';
  h += '<span><span style="color:var(--yellow)">&#9679;</span> Makul</span>';
  h += '<span><span style="color:var(--red2)">&#9679;</span> Dikkat</span>';
  h += '<span>- = Veri yok</span>';
  h += '<span style="margin-left:auto"><span style="background:rgba(16,185,129,.15);color:var(--green);padding:1px 4px;border-radius:3px">P</span> Portfoy</span>';
  h += '</div></div></div>';

  container.innerHTML = h;
}
</script>
</body>
</html>
